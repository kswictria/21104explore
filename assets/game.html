<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101924;
  color: #edf4f5;
  font: 14px system-ui, "Malgun Gothic", sans-serif;
}

#app {
  position: relative;
  overflow: hidden;
  border: 1px solid #385164;
  border-radius: 15px;
}

header, footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: #172b3d;
}

footer {
  justify-content: flex-start;
  flex-wrap: wrap;
}

small {
  display: block;
  font: bold 11px monospace;
  letter-spacing: 2px;
  color: #99c5d5;
}

h2 {
  font-size: 20px;
  margin: 4px 0;
}

#clock {
  color: #ffd087;
  font: bold 30px monospace;
}

#clock.red {
  color: #ff6464;
  animation: pulse .8s infinite alternate;
}

@keyframes pulse {
  to { opacity: .45; }
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 2 / 1;
  background: #142d41;
  touch-action: none;
  cursor: crosshair;
}

button {
  padding: 11px 14px;
  border-radius: 9px;
  border: 1px solid #708c9c;
  background: #344d60;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.15);
}

button.primary {
  background: #d88a60;
  color: #182431;
  border-color: #ffc099;
}

#hint {
  flex: 1;
  min-width: 240px;
  font-size: 13px;
  color: #d3dfe2;
}

#overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 20;
  align-items: center;
  justify-content: center;
  background: rgba(7, 18, 28, 0.65);
}

#overlay.show {
  display: flex;
}

.dialog {
  width: min(90%, 390px);
  padding: 32px;
  text-align: center;
  background: #22394b;
  border: 1px solid #9bb9c5;
  border-radius: 17px;
  backdrop-filter: blur(3px);
}

.dialog h1 {
  font-size: 44px;
  margin: 15px 0;
}
</style>
</head>

<body>
<div id="app">
  <header>
    <div>
      <small>MECHA LAB / MISSION CONTROL</small>
      <h2 id="title">MISSION</h2>
    </div>
    <div style="text-align:right">
      <small>TIME REMAINING</small>
      <div id="clock">00:00</div>
    </div>
  </header>

  <canvas id="game"></canvas>

  <footer>
    <button class="primary" id="action">
      집게 닫기 / 열기 (Space)
    </button>
    <button id="restart">다시 시작</button>
    <div id="hint">관절을 움직여 목표에 접근하세요.</div>
  </footer>

  <div id="overlay">
    <div class="dialog">
      <small>MISSION REPORT</small>
      <h1 id="outcome"></h1>
      <p id="detail"></p>
      <button class="primary" id="retry">다시 도전</button>
      <p style="font-size:12px;color:#b6cbd4">
        처음으로 돌아가기는 게임 아래의 Streamlit 버튼을 이용하세요.
      </p>
    </div>
  </div>
</div>

<script>
const cfg = __GAME_CONFIG__;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const clock = document.getElementById("clock");
const hint = document.getElementById("hint");

document.getElementById("title").textContent = cfg.title;

const W = 1000;
const H = 500;

const base = {x: 115, y: 430};
const lengths = [222, 241, 194];
const sensitivity = [0.53, 0.78, 1.08];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const tasks = [
  "보호 덮개 제거",
  "버튼 A 누르기",
  "버튼 B 누르기",
  "슬라이드 스위치 작동",
  "4색 전선 연결",
  "움직이는 신호 지점에 안테나 정렬"
];

let angles, points;
let drag = -1;
let lastPointer = null;
let held = false;
let done = false;
let phase = 0;
let offset = {x: 0, y: 0};

let rock, battery, cover, switchX;
let progress = 0;
let wires = [];
let wireIndex = -1;
let antenna;

let started, last;
let sceneTime = 0;

let endingState = null;     // "success" | "fail" | null
let endingStart = 0;
let overlayReady = false;
let burstParticles = [];
let celebrationBaseAngles = null;
let failPoints = null;

const duration = Number(cfg.duration) ||
  (cfg.mission === "rock" ? 90 :
   cfg.mission === "battery" ? 120 : 240);

// ===== CANVAS =====

function fit() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * ratio);
  canvas.height = Math.round(canvas.clientWidth * ratio * H / W);
  ctx.setTransform(
    canvas.width / W, 0,
    0, canvas.height / H,
    0, 0
  );
}

function rect(x, y, w, h, color, radius = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fill();
}

function line(x, y, X, Y, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(X, Y);
  ctx.stroke();
}

function dot(x, y, radius, color, border = "", bw = 1) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  if (border) {
    ctx.strokeStyle = border;
    ctx.lineWidth = bw;
    ctx.stroke();
  }
}

function txt(value, x, y, size = 13, color = "#e3edf1") {
  ctx.font = `bold ${size}px system-ui`;
  ctx.fillStyle = color;
  ctx.fillText(value, x, y);
}

function tell(value) {
  hint.textContent = value;
}

// ===== ANIMATION HELPERS =====

function signalTarget() {
  return {
    x: 744 + Math.sin(sceneTime * 1.4) * 34,
    y: 187 + Math.cos(sceneTime * 1.9) * 22
  };
}

function makeParticles() {
  const origin = tip();
  const colors = ["#ffcf86", "#7df0bb", "#ff8e82", "#88dfff", "#fff1a8"];

  burstParticles = [];

  for (let i = 0; i < 42; i++) {
    const angle = (Math.PI * 2 * i) / 42 + Math.random() * 0.25;
    const speed = 80 + Math.random() * 180;

    burstParticles.push({
      x: origin.x,
      y: origin.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 30,
      size: 3 + Math.random() * 4,
      color: colors[i % colors.length]
    });
  }
}

function drawParticles(t) {
  burstParticles.forEach(p => {
    const x = p.x + p.vx * t;
    const y = p.y + p.vy * t + 120 * t * t;
    const alpha = Math.max(0, 1 - t / 2.2);

    ctx.globalAlpha = alpha;
    dot(x, y, p.size, p.color);
    ctx.globalAlpha = 1;
  });
}

// ===== ROBOT ARM =====

function arm(customAngles = null) {
  const usedAngles = customAngles || angles;
  points = [{...base}];
  let angle = 0;

  for (let i = 0; i < 3; i++) {
    angle += usedAngles[i];
    const p = points[i];

    points.push({
      x: p.x + Math.cos(angle) * lengths[i],
      y: p.y + Math.sin(angle) * lengths[i]
    });
  }

  return points[3];
}

function tip(customAngles = null) {
  const wrist = arm(customAngles);
  const usedAngles = customAngles || angles;
  const angle = usedAngles.reduce((sum, v) => sum + v, 0);

  return {
    x: wrist.x + 61 * Math.cos(angle),
    y: wrist.y + 61 * Math.sin(angle)
  };
}

function looseWire() {
  const p = tip();
  let nearest = -1;
  let best = 25;

  wires.forEach((wire, i) => {
    if (wire.connected) return;
    const d = dist(p, wire.pos);

    if (d < best) {
      best = d;
      nearest = i;
    }
  });

  return nearest;
}

function target() {
  if (cfg.mission === "rock") return rock;

  if (cfg.mission === "battery") {
    return phase === 0 ? {x: 552, y: 301} : battery;
  }

  if (phase === 0) return cover;
  if (phase === 1) return {x: 614, y: 282};
  if (phase === 2) return {x: 682, y: 325};
  if (phase === 3) return {x: switchX, y: 258};

  if (phase === 4) {
    const i = looseWire();
    return i < 0 ? {x: -999, y: -999} : wires[i].pos;
  }

  return signalTarget();
}

function reach() {
  if (done || held) return false;

  if (cfg.mission === "satellite" && phase === 4) {
    return looseWire() !== -1;
  }

  let radius = 26;

  if (cfg.mission === "satellite" && (phase === 1 || phase === 2)) {
    radius = 17;
  }

  if (cfg.mission === "satellite" && phase === 5) {
    radius = 24;
  }

  return dist(tip(), target()) <= radius;
}

// ===== BACKGROUND =====

function drawSpaceBackground() {
  rect(0, 0, W, H, "#12263a");

  for (let i = 0; i < 34; i++) {
    const x = ((i * 61) + sceneTime * (8 + (i % 5) * 2)) % (W + 80) - 40;
    const y = 35 + ((i * 79) % 360);
    const r = 1 + (i % 3) * 0.7;
    dot(x, y, r, i % 4 === 0 ? "#c5ecff" : "#dfefff");
  }

  const px1 = 860 - Math.sin(sceneTime * 0.22) * 25;
  const py1 = 96 + Math.cos(sceneTime * 0.18) * 10;
  dot(px1, py1, 34, "#6a6fbe");
  dot(px1 - 10, py1 - 9, 10, "#9295e0");
  ctx.strokeStyle = "#b1b4ef88";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(px1, py1, 48, 12, -0.2, 0, Math.PI * 2);
  ctx.stroke();

  const px2 = 140 + Math.cos(sceneTime * 0.17) * 18;
  const py2 = 90 + Math.sin(sceneTime * 0.23) * 12;
  dot(px2, py2, 22, "#b67165");
  dot(px2 - 5, py2 - 4, 7, "#d99c90");

  const g = ctx.createRadialGradient(500, 60, 10, 500, 60, 260);
  g.addColorStop(0, "rgba(84,140,190,0.15)");
  g.addColorStop(1, "rgba(84,140,190,0)");
  ctx.fillStyle = g;
  ctx.fillRect(180, 0, 640, 220);

  for (let x = 0; x < W; x += 145) {
    line(x, 0, x, H, "#27495d", 2);
  }

  for (let y = 0; y < H; y += 91) {
    line(0, y, W, y, "#27495d", 2);
  }

  rect(0, 446, W, 54, "#27475a");
}

function background() {
  if (cfg.mission === "rock") {
    rect(0, 0, W, H, "#d7a57c");
    rect(0, 335, W, 165, "#c58c67");
    rect(0, 438, W, 62, "#a66f53");

    for (let i = 0; i < 17; i++) {
      dot(
        24 + i * 57,
        452 + (i % 3) * 9,
        3 + (i % 4),
        "#80533e"
      );
    }

    txt("MARS / SAMPLE ACQUISITION", 24, 33, 14, "#614537");
  } else if (cfg.mission === "battery") {
    rect(0, 0, W, H, "#142c40");

    for (let x = 0; x < W; x += 145) {
      line(x, 0, x, H, "#27495d", 2);
    }

    for (let y = 0; y < H; y += 91) {
      line(0, y, W, y, "#27495d", 2);
    }

    rect(0, 446, W, 54, "#27475a");
    txt("ORBITAL BATTERY SERVICE", 22, 32, 14, "#acd6e5");
  } else {
    drawSpaceBackground();
    txt("SATELLITE REPAIR / EXTERNAL PANEL", 22, 32, 14, "#acd6e5");
  }
}

function gauge(value, title) {
  rect(777, 55, 207, 65, "#20394b", 9);
  txt(title, 789, 76, 12, "#c4dbe4");
  rect(788, 90, 184, 13, "#435766", 6);
  rect(788, 90, 184 * clamp(value, 0, 1), 13, "#84d8a6", 6);
}

// ===== MISSION GRAPHICS =====

function rockScene() {
  rect(420, 216, 170, 117, "#8aafa1", 12);
  rect(438, 237, 136, 70, "#41675d", 10);
  rect(452, 248, 108, 47, "#2b5048", 8);

  txt("SAMPLE RECEIVER", 423, 204, 12, "#573e32");

  dot(
    rock.x, rock.y, 27,
    "#9e6349",
    reach() ? "#76e5a5" : "#ecc19b",
    reach() ? 5 : 3
  );
  dot(rock.x - 8, rock.y - 7, 7, "#bd8763");

  txt("SAMPLE", rock.x - 28, rock.y - 40, 12, "#593c33");
}

function batteryScene() {
  rect(505, 221, 282, 162, "#667f8c", 14);
  rect(524, 245, 244, 120, "#243c4e", 10);
  rect(552, 282, 193, 68, "#3d5b6c", 8);
  rect(552, 357, 193, 6, "#b3c5cd", 3);

  rect(
    539, 283, 26, 35,
    phase === 0
      ? (reach() ? "#85e6b3" : "#dc6664")
      : "#7ac6a5",
    5
  );

  txt(phase === 0 ? "LOCK" : "OPEN", 525, 267);

  rect(battery.x - 34, battery.y - 27, 70, 54, "#edc16b", 8);
  rect(battery.x - 27, battery.y - 19, 55, 10, "#f6dfae", 3);

  txt("Li-ion", battery.x - 25, battery.y + 10, 14, "#304453");

  gauge(phase === 0 ? 0 : progress, "배터리 분리 진행률");

  txt(
    phase === 0
      ? "① 잠금장치 해제"
      : "② 배터리를 오른쪽으로 당기기",
    500, 417
  );
}

function drawSignalWaves(node) {
  const pulse = (Math.sin(sceneTime * 4) + 1) / 2;

  for (let i = 0; i < 3; i++) {
    const radius = 12 + i * 12 + pulse * 8;
    ctx.strokeStyle = `rgba(130,238,177,${0.45 - i * 0.11})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(node.x, node.y, radius, -0.8, 0.8);
    ctx.stroke();
  }

  line(node.x - 2, node.y + 18, node.x - 2, node.y + 34, "#89e8b0", 3);
}

function satelliteScene() {
  rect(487, 214, 84, 140, "#315471", 5);
  rect(766, 214, 88, 140, "#315471", 5);

  for (let j = 0; j < 4; j++) {
    line(501 + j * 18, 220, 501 + j * 18, 346, "#6b9bb9", 2);
    line(780 + j * 18, 220, 780 + j * 18, 346, "#6b9bb9", 2);
    line(491, 238 + j * 29, 567, 238 + j * 29, "#6b9bb9", 2);
    line(770, 238 + j * 29, 850, 238 + j * 29, "#6b9bb9", 2);
  }

  rect(557, 155, 225, 270, "#607e90", 14);
  rect(572, 173, 196, 230, "#244054", 10);

  txt(`STEP ${phase + 1}/6`, 585, 198, 15, "#9fd0df");
  txt(tasks[phase], 585, 222, 13);

  if (phase === 0) {
    rect(
      cover.x - 33, cover.y - 28, 66, 56,
      reach() ? "#8ae3b0" : "#d3aa78", 7
    );

    rect(
      cover.x - 22, cover.y - 17, 44, 34,
      "#e5c39b", 5
    );

    txt("COVER", cover.x - 27, cover.y - 40, 12);
  }

  else if (phase === 1 || phase === 2) {
    dot(
      614, 282, 17,
      phase === 1
        ? (reach() ? "#8df0b4" : "#db6864")
        : "#5a977e",
      "#d9e8ed", 3
    );

    dot(
      682, 325, 17,
      phase === 2
        ? (reach() ? "#8df0b4" : "#db6864")
        : "#577d87",
      "#d9e8ed", 3
    );

    txt("A", 608, 289);
    txt("B", 676, 332);
    txt(
      phase === 1 ? "버튼 A를 누르세요" : "버튼 B를 누르세요",
      586, 377
    );
  }

  else if (phase === 3) {
    rect(591, 252, 150, 9, "#acc1c8", 4);

    rect(
      switchX - 15, 236, 30, 30,
      reach() ? "#8fe9b6" : "#d4b37c", 5
    );

    txt("SLIDE RIGHT", 592, 292);
  }

  else if (phase === 4) {
    wires.forEach(w => {
      line(w.home.x - 27, w.home.y, w.pos.x, w.pos.y, w.color, 5);
      dot(w.socket.x, w.socket.y, 13, "#1b3042", w.color, 5);

      dot(
        w.pos.x, w.pos.y, 10,
        w.connected ? "#92e7b8" : w.color,
        "#e7eef2", 2
      );
    });

    txt("같은 색 소켓에 연결", 578, 389, 12);
  }

  else if (phase === 5) {
    const node = signalTarget();

    line(600, 354, antenna.x, antenna.y, "#d4b579", 12);

    dot(
      antenna.x, antenna.y, 15,
      reach() ? "#80e6ab" : "#d6b579",
      "#e8e5d3", 3
    );

    dot(node.x, node.y, 12, "#203f50", "#82eeb1", 4);
    dot(node.x, node.y, 4, "#d8fff0");
    drawSignalWaves(node);

    txt("SIGNAL", node.x - 22, node.y - 26, 12, "#9fe7c1");
    txt("움직이는 전파 신호 지점에 안테나를 맞추세요", 545, 388, 12);
  }

  const connected = wires.filter(w => w.connected).length;
  const value = phase / 6 + (phase === 4 ? connected / 24 : 0);
  gauge(value, "위성 정비 진행률");
}

// ===== ARM GRAPHICS =====

function drawLinkGraphic(x1, y1, x2, y2) {
  line(x1 + 5, y1 + 5, x2 + 5, y2 + 5, "#263846", 35);
  line(x1, y1, x2, y2, "#405e6e", 30);
  line(x1, y1, x2, y2, "#abc4c9", 19);
  line(x1 + 4, y1 - 4, x2 + 4, y2 - 4, "#ede5d8", 4);

  dot(
    x1 + (x2 - x1) * .32,
    y1 + (y2 - y1) * .32,
    6, "#e9a875", "#405564", 2
  );
}

function drawJointGraphic(x, y, active = false, label = "") {
  dot(x, y, 20, "#324b5b", "#dce9ec", 4);
  dot(x, y, 13, active ? "#ffcb69" : "#da6d62", "#2c4150", 3);
  dot(x, y, 3, "#fff7df");

  if (label) txt(label, x - 11, y - 26, 12);
}

function drawGripperFrom(wrist, totalAngle, closed) {
  ctx.save();
  ctx.translate(wrist.x, wrist.y);
  ctx.rotate(totalAngle);

  rect(-4, -15, 37, 30, "#425e6d", 6);
  rect(21, -10, 23, 20, "#c1d5d5", 4);

  const gap = closed ? 7 : 19;

  line(43, -gap, 56, -gap, "#d9e7e6", 9);
  line(43, gap, 56, gap, "#d9e7e6", 9);

  line(56, -gap, 70, -gap + 9, "#e49b72", 7);
  line(56, gap, 70, gap - 9, "#e49b72", 7);

  ctx.restore();

  const p = {
    x: wrist.x + 61 * Math.cos(totalAngle),
    y: wrist.y + 61 * Math.sin(totalAngle)
  };

  dot(
    p.x, p.y, 5,
    endingState === "success" ? "#66f1a8" : "#f6c67a",
    "#183443", 2
  );
}

function drawArm(displayAngles = null) {
  const useAngles = displayAngles || angles;
  const savedPoints = [{...base}];
  let acc = 0;

  for (let i = 0; i < 3; i++) {
    acc += useAngles[i];
    const p = savedPoints[i];

    savedPoints.push({
      x: p.x + Math.cos(acc) * lengths[i],
      y: p.y + Math.sin(acc) * lengths[i]
    });
  }

  rect(54, 423, 128, 57, "#293f50", 7);
  rect(75, 439, 87, 10, "#7397a2", 3);

  for (let i = 0; i < 3; i++) {
    const a = savedPoints[i];
    const b = savedPoints[i + 1];
    drawLinkGraphic(a.x, a.y, b.x, b.y);
  }

  for (let i = 0; i < 3; i++) {
    const p = savedPoints[i];
    drawJointGraphic(p.x, p.y, drag === i, "J" + (i + 1));
  }

  const totalAngle = useAngles.reduce((s, v) => s + v, 0);
  const wrist = savedPoints[3];
  drawGripperFrom(wrist, totalAngle, held);
}

function drawBrokenArm(t) {
  if (!failPoints) return;

  const p0 = failPoints[0];
  const p1 = failPoints[1];
  const p2 = failPoints[2];
  const p3 = failPoints[3];

  rect(54, 423, 128, 57, "#293f50", 7);
  rect(75, 439, 87, 10, "#7397a2", 3);

  drawJointGraphic(p0.x, p0.y, false, "J1");

  function drawPiece(start, end, dx, dy, rot, withLabel = false, label = "") {
    ctx.save();
    ctx.translate(dx, dy);
    ctx.translate(start.x, start.y);
    ctx.rotate(rot);
    ctx.translate(-start.x, -start.y);

    drawLinkGraphic(start.x, start.y, end.x, end.y);
    drawJointGraphic(start.x, start.y, false, withLabel ? label : "");
    drawJointGraphic(end.x, end.y, false);

    ctx.restore();
  }

  const tt = Math.min(1.5, t);

  drawPiece(p0, p1, 12 * tt, 18 * tt, -0.35 * tt, false);
  drawPiece(p1, p2, 50 * tt, 50 * tt, 0.9 * tt, true, "J2");
  drawPiece(p2, p3, 92 * tt, 84 * tt, 1.45 * tt, true, "J3");

  for (let i = 0; i < 12; i++) {
    const sx = p1.x + i * 6;
    const sy = p1.y - (i % 3) * 3;
    line(
      sx, sy,
      sx + Math.cos(i) * (18 + tt * 18),
      sy + Math.sin(i * 1.2) * (12 + tt * 9),
      "#ffb45e", 2
    );
  }
}

// ===== SUCCESS/FAIL SPECIAL EFFECTS =====

function drawRover(x, y, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  rect(-45, -18, 90, 24, "#748a7f", 6);
  rect(-18, -40, 42, 25, "#a6b7ac", 5);
  rect(18, -50, 24, 8, "#d4d7cc", 4);

  line(-5, -15, 18, -42, "#98a89e", 4);
  dot(20, -44, 6, "#cfe6e4");

  dot(-28, 14, 12, "#2b3c45");
  dot(2, 14, 12, "#2b3c45");
  dot(32, 14, 12, "#2b3c45");

  dot(-28, 14, 5, "#81989a");
  dot(2, 14, 5, "#81989a");
  dot(32, 14, 5, "#81989a");

  ctx.restore();
}

function drawSuspendedBattery(x, y, scale = 1) {
  line(x, 0, x, y - 20, "#bfcfd8", 3);

  rect(x - 26 * scale, y - 20 * scale, 52 * scale, 40 * scale, "#efc16d", 7);
  rect(x - 20 * scale, y - 12 * scale, 40 * scale, 8 * scale, "#f8e3aa", 3);
  txt("Li", x - 8, y + 4, 12, "#304453");
}

function drawMeteor(x, y) {
  for (let i = 0; i < 8; i++) {
    ctx.globalAlpha = Math.max(0.05, 0.32 - i * 0.035);
    line(x + i * 20, y - i * 12, x + i * 55, y - i * 28, "#ffe29c", 7 - i * 0.7);
  }
  ctx.globalAlpha = 1;
  dot(x, y, 15, "#fff0b4");
  dot(x - 6, y - 4, 8, "#ffd98b");
}

function drawCelebrationSatellite(x, y, t) {
  const wobble = Math.sin(t * 7) * 0.12;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(wobble);

  rect(-64, -38, 128, 76, "#607e90", 12);
  rect(-54, -28, 108, 56, "#244054", 8);
  rect(-138, -28, 58, 56, "#315471", 4);
  rect(80, -28, 58, 56, "#315471", 4);

  for (let i = 0; i < 3; i++) {
    line(-128 + i * 18, -24, -128 + i * 18, 24, "#6b9bb9", 2);
    line(90 + i * 18, -24, 90 + i * 18, 24, "#6b9bb9", 2);
  }

  line(-10, 38, 28, 70, "#d4b579", 6);
  dot(28, 70, 8, "#8ee8b7", "#e8f6ea", 2);

  ctx.restore();
}

function drawSuccessEffects(t) {
  drawParticles(t);

  if (cfg.mission === "rock") {
    const roverX = W + 120 - Math.min(t * 280, W + 280);
    drawRover(roverX, 406, 1.05);
  }

  if (cfg.mission === "battery") {
    const starts = [0.1, 0.45, 0.8];
    const xs = [110, 180, 250];

    for (let i = 0; i < 3; i++) {
      const local = Math.max(0, t - starts[i]);
      const y = 30 + clamp(local * 170, 0, 145);
      drawSuspendedBattery(xs[i], y, 1);
    }
  }

  if (cfg.mission === "satellite") {
    const meteorT = Math.max(0, t - 0.2);
    const mx = 930 - meteorT * 320;
    const my = 80 + meteorT * 170;
    drawMeteor(mx, my);
    drawCelebrationSatellite(855, 95, t);
  }
}

function drawFailureEffects(t) {
  drawBrokenArm(t);
}

// ===== DRAW =====

function draw() {
  ctx.clearRect(0, 0, W, H);
  background();

  if (cfg.mission === "rock") rockScene();
  else if (cfg.mission === "battery") batteryScene();
  else satelliteScene();

  if (endingState === "fail") {
    drawFailureEffects((performance.now() - endingStart) / 1000);
  } else {
    drawArm();
  }

  if (endingState === "success") {
    drawSuccessEffects((performance.now() - endingStart) / 1000);
  }

  if (!done) {
    txt(
      "관절 선택 → 원형으로 드래그",
      20, 68, 13,
      cfg.mission === "rock" ? "#5c3b30" : "#b8dbe7"
    );

    if (reach()) {
      txt(
        "● 접촉했습니다! 집게 버튼을 누르세요",
        20, 92, 13,
        cfg.mission === "rock" ? "#317650" : "#88e8b1"
      );
    }
  }
}

// ===== GAME PROGRESSION =====

function finish(success) {
  if (done) return;

  done = true;
  held = false;
  endingState = success ? "success" : "fail";
  endingStart = performance.now();
  overlayReady = false;

  arm();

  if (success) {
    celebrationBaseAngles = [...angles];
    makeParticles();
  } else {
    failPoints = points.map(p => ({...p}));
  }

  const out = document.getElementById("outcome");
  out.textContent = success ? "SUCCESS" : "FAILED";
  out.style.color = success ? "#a1efbb" : "#fc8179";

  document.getElementById("detail").textContent =
    success
      ? "임무를 성공적으로 완료했습니다."
      : "제한시간이 종료되었습니다.";
}

function showOverlay() {
  if (overlayReady) return;
  overlayReady = true;
  document.getElementById("overlay").classList.add("show");
}

function next() {
  held = false;
  offset = {x: 0, y: 0};
  wireIndex = -1;
  phase++;

  if (phase >= 6) finish(true);
  else tell("다음 작업: " + tasks[phase]);
}

function action() {
  if (done) return;

  const p = tip();

  if (cfg.mission === "battery" && phase === 0) {
    if (!reach()) {
      tell("잠금장치에 집게 끝을 정확히 맞춰 주세요.");
      return;
    }

    phase = 1;
    tell("잠금 해제 완료! 배터리를 집고 오른쪽으로 당기세요.");
    return;
  }

  if (
    cfg.mission === "satellite" &&
    (phase === 1 || phase === 2)
  ) {
    if (!reach()) {
      tell("버튼 중앙에 집게 끝을 맞춰야 합니다.");
      return;
    }

    next();
    return;
  }

  if (!held) {
    if (!reach()) {
      tell("집게 끝을 목표에 더 정확히 맞춰 주세요.");
      return;
    }

    held = true;

    if (cfg.mission === "satellite" && phase === 4) {
      wireIndex = looseWire();

      if (wireIndex < 0) {
        held = false;
        tell("전선 끝에 집게를 맞춰 주세요.");
        return;
      }

      const w = wires[wireIndex];

      offset = {
        x: w.pos.x - p.x,
        y: w.pos.y - p.y
      };

      tell("전선을 집었습니다. 같은 색 소켓으로 옮기세요.");
      return;
    }

    const t = target();

    offset = {
      x: t.x - p.x,
      y: t.y - p.y
    };

    tell("물체를 집었습니다. 이동한 뒤 다시 눌러 놓으세요.");
    return;
  }

  held = false;

  if (cfg.mission === "rock") {
    if (
      rock.x > 458 && rock.x < 560 &&
      rock.y > 243 && rock.y < 307
    ) {
      finish(true);
    } else {
      tell("암석을 샘플 보관함 내부에 놓으세요.");
    }
    return;
  }

  if (cfg.mission === "battery") {
    tell("배터리를 놓았습니다.");
    return;
  }

  if (phase === 0) {
    if (cover.x < 555) next();
    else tell("덮개를 왼쪽으로 더 옮기세요.");
    return;
  }

  if (phase === 3) {
    if (switchX >= 715) next();
    else tell("스위치를 오른쪽 끝까지 옮기세요.");
    return;
  }

  if (phase === 4) {
    const w = wires[wireIndex];
    if (!w) return;

    if (dist(w.pos, w.socket) <= 19) {
      w.pos = {...w.socket};
      w.connected = true;

      if (wires.every(item => item.connected)) {
        next();
      } else {
        tell("전선 연결 성공! 남은 색상도 연결하세요.");
      }
    } else {
      w.pos = {...w.home};
      tell("소켓에 정확히 연결하지 못했습니다. 다시 시도하세요.");
    }

    wireIndex = -1;
    return;
  }

  if (phase === 5) {
    const node = signalTarget();

    if (dist(antenna, node) <= 22) {
      next();
    } else {
      tell("움직이는 신호 위치에 안테나 끝을 맞춰 주세요.");
    }
  }
}

// ===== POINTER CONTROL =====

function mouse(e) {
  const r = canvas.getBoundingClientRect();

  return {
    x: (e.clientX - r.left) * W / r.width,
    y: (e.clientY - r.top) * H / r.height
  };
}

canvas.addEventListener("pointerdown", e => {
  if (done) return;

  const p = mouse(e);
  arm();

  drag = -1;
  let best = 43;

  for (let i = 0; i < 3; i++) {
    const d = dist(p, points[i]);

    if (d < best) {
      best = d;
      drag = i;
    }
  }

  if (drag >= 0) {
    lastPointer = p;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove", e => {
  if (done || drag < 0 || !lastPointer) return;

  const p = mouse(e);
  const pivot = points[drag];

  const before = Math.atan2(
    lastPointer.y - pivot.y,
    lastPointer.x - pivot.x
  );

  const after = Math.atan2(
    p.y - pivot.y,
    p.x - pivot.x
  );

  const delta = Math.atan2(
    Math.sin(after - before),
    Math.cos(after - before)
  );

  angles[drag] = clamp(
    angles[drag] + delta * sensitivity[drag],
    -2.85, 2.85
  );

  lastPointer = p;
  draw();
});

for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(event, () => {
    drag = -1;
    lastPointer = null;
  });
}

// ===== TIMER AND MOVEMENT =====

function tick(now) {
  const dt = clamp((now - last) / 1000, 0, .05);
  last = now;
  sceneTime = (now - started) / 1000;

  if (!done) {
    const remaining = Math.max(
      0,
      Math.ceil(duration - (now - started) / 1000)
    );

    clock.textContent =
      String(Math.floor(remaining / 60)).padStart(2, "0")
      + ":"
      + String(remaining % 60).padStart(2, "0");

    clock.classList.toggle("red", remaining <= 60);

    if (remaining === 0) finish(false);

    if (held && !done) {
      const p = tip();

      if (cfg.mission === "rock") {
        rock = {
          x: p.x + offset.x,
          y: p.y + offset.y
        };
      }

      else if (cfg.mission === "battery") {
        const desired = clamp(p.x + offset.x, 608, 718);

        battery.x += clamp(
          desired - battery.x,
          -95 * dt,
          95 * dt
        );

        progress = clamp((battery.x - 608) / 110, 0, 1);

        if (progress >= .995) finish(true);
      }

      else if (cfg.mission === "satellite") {
        if (phase === 0) {
          cover = {
            x: p.x + offset.x,
            y: p.y + offset.y
          };
        }

        else if (phase === 3) {
          switchX = clamp(p.x + offset.x, 595, 730);
        }

        else if (phase === 4 && wireIndex >= 0) {
          wires[wireIndex].pos = {
            x: p.x + offset.x,
            y: p.y + offset.y
          };
        }

        else if (phase === 5) {
          antenna = {
            x: p.x + offset.x,
            y: p.y + offset.y
          };
        }
      }
    }
  } else {
    const endT = (now - endingStart) / 1000;

    if (endingState === "success" && celebrationBaseAngles) {
      angles = [
        celebrationBaseAngles[0] + Math.sin(endT * 5.2) * 0.30,
        celebrationBaseAngles[1] + Math.sin(endT * 7.4 + 0.8) * 0.24,
        celebrationBaseAngles[2] + Math.cos(endT * 8.6 + 0.3) * 0.38
      ];
    }

    if (!overlayReady && endT > 2.4) {
      showOverlay();
    }
  }

  draw();
  requestAnimationFrame(tick);
}

// ===== RESTART =====

function restart() {
  angles = [-1.08, .48, .53];

  drag = -1;
  lastPointer = null;
  held = false;
  done = false;
  phase = 0;
  wireIndex = -1;

  offset = {x: 0, y: 0};

  rock = {x: 770, y: 392};
  battery = {x: 608, y: 315};
  cover = {x: 654, y: 308};
  switchX = 595;
  progress = 0;

  wires = [
    {
      color: "#61b9fc",
      home: {x: 581, y: 340},
      pos: {x: 581, y: 340},
      socket: {x: 725, y: 272},
      connected: false
    },
    {
      color: "#63d58f",
      home: {x: 612, y: 306},
      pos: {x: 612, y: 306},
      socket: {x: 693, y: 345},
      connected: false
    },
    {
      color: "#f3c75b",
      home: {x: 575, y: 372},
      pos: {x: 575, y: 372},
      socket: {x: 722, y: 307},
      connected: false
    },
    {
      color: "#e96562",
      home: {x: 607, y: 256},
      pos: {x: 607, y: 256},
      socket: {x: 692, y: 237},
      connected: false
    }
  ];

  antenna = {x: 652, y: 312};

  started = performance.now();
  last = started;
  sceneTime = 0;

  endingState = null;
  endingStart = 0;
  overlayReady = false;
  burstParticles = [];
  celebrationBaseAngles = null;
  failPoints = null;

  document.getElementById("overlay").classList.remove("show");

  clock.textContent =
    String(Math.floor(duration / 60)).padStart(2, "0")
    + ":"
    + String(duration % 60).padStart(2, "0");

  clock.classList.remove("red");

  if (cfg.mission === "satellite") {
    tell("6단계: 덮개 → 버튼 A → 버튼 B → 스위치 → 전선 → 움직이는 신호 지점에 안테나 정렬");
  } else {
    tell("집게 끝을 목표에 맞추고 버튼을 눌러 작업하세요.");
  }

  draw();
}

document.getElementById("action").onclick = action;
document.getElementById("restart").onclick = restart;
document.getElementById("retry").onclick = restart;

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    action();
  }
});

window.addEventListener("resize", () => {
  fit();
  draw();
});

fit();
restart();
requestAnimationFrame(tick);
</script>
