
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101924;
  color: #edf4f5;
  font: 14px system-ui, "Malgun Gothic", sans-serif;
}

#app {
  position: relative;
  overflow: hidden;
  border: 1px solid #385164;
  border-radius: 15px;
}

header, footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: #172b3d;
}

footer {
  justify-content: flex-start;
  flex-wrap: wrap;
}

small {
  display: block;
  font: bold 11px monospace;
  letter-spacing: 2px;
  color: #99c5d5;
}

h2 {
  font-size: 20px;
  margin: 4px 0;
}

#clock {
  color: #ffd087;
  font: bold 30px monospace;
}

#clock.red {
  color: #ff6464;
  animation: pulse .8s infinite alternate;
}

@keyframes pulse {
  to { opacity: .45; }
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 2 / 1;
  background: #142d41;
  touch-action: none;
  cursor: crosshair;
}

button {
  padding: 11px 14px;
  border-radius: 9px;
  border: 1px solid #708c9c;
  background: #344d60;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.15);
}

button.primary {
  background: #d88a60;
  color: #182431;
  border-color: #ffc099;
}

#hint {
  flex: 1;
  min-width: 240px;
  font-size: 13px;
  color: #d3dfe2;
}

#overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 20;
  align-items: center;
  justify-content: center;
  background: #07121ce8;
}

#overlay.show {
  display: flex;
}

.dialog {
  width: min(90%, 390px);
  padding: 32px;
  text-align: center;
  background: #22394b;
  border: 1px solid #9bb9c5;
  border-radius: 17px;
}

.dialog h1 {
  font-size: 44px;
  margin: 15px 0;
}
</style>
</head>

<body>
<div id="app">
  <header>
    <div>
      <small>MECHA LAB / MISSION CONTROL</small>
      <h2 id="title">MISSION</h2>
    </div>
    <div style="text-align:right">
      <small>TIME REMAINING</small>
      <div id="clock">00:00</div>
    </div>
  </header>

  <canvas id="game"></canvas>

  <footer>
    <button class="primary" id="action">
      집게 닫기 / 열기 (Space)
    </button>
    <button id="restart">다시 시작</button>
    <div id="hint">관절을 움직여 목표에 접근하세요.</div>
  </footer>

  <div id="overlay">
    <div class="dialog">
      <small>MISSION REPORT</small>
      <h1 id="outcome"></h1>
      <p id="detail"></p>
      <button class="primary" id="retry">다시 도전</button>
      <p style="font-size:12px;color:#b6cbd4">
        처음으로 돌아가기는 게임 아래의
        Streamlit 버튼을 이용하세요.
      </p>
    </div>
  </div>
</div>

<script>
const cfg = __GAME_CONFIG__;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const clock = document.getElementById("clock");
const hint = document.getElementById("hint");

document.getElementById("title").textContent = cfg.title;

const W = 1000;
const H = 500;

const base = {x: 115, y: 430};
const lengths = [222, 241, 194];
const sensitivity = [0.53, 0.78, 1.08];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const tasks = [
  "보호 덮개 제거",
  "버튼 A 누르기",
  "버튼 B 누르기",
  "슬라이드 스위치 작동",
  "4색 전선 연결",
  "안테나 정렬 및 고정"
];

const dock = {x: 740, y: 211};

let angles, points;
let drag = -1;
let lastPointer = null;
let held = false;
let done = false;
let phase = 0;
let offset = {x: 0, y: 0};

let rock, battery, cover, switchX;
let progress = 0;
let wires = [];
let wireIndex = -1;
let antenna;
let started, last;

const duration = Number(cfg.duration) ||
  (cfg.mission === "rock" ? 90 :
   cfg.mission === "battery" ? 120 : 240);

// ===== CANVAS =====

function fit() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * ratio);
  canvas.height = Math.round(canvas.clientWidth * ratio * H / W);
  ctx.setTransform(
    canvas.width / W, 0,
    0, canvas.height / H,
    0, 0
  );
}

function rect(x, y, w, h, color, radius = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fill();
}

function line(x, y, X, Y, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(X, Y);
  ctx.stroke();
}

function dot(x, y, radius, color, border = "", bw = 1) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  if (border) {
    ctx.strokeStyle = border;
    ctx.lineWidth = bw;
    ctx.stroke();
  }
}

function txt(value, x, y, size = 13, color = "#e3edf1") {
  ctx.font = `bold ${size}px system-ui`;
  ctx.fillStyle = color;
  ctx.fillText(value, x, y);
}

function tell(value) {
  hint.textContent = value;
}

// ===== ROBOT ARM =====

function arm() {
  points = [{...base}];
  let angle = 0;

  for (let i = 0; i < 3; i++) {
    angle += angles[i];
    const p = points[i];

    points.push({
      x: p.x + Math.cos(angle) * lengths[i],
      y: p.y + Math.sin(angle) * lengths[i]
    });
  }

  return points[3];
}

function tip() {
  const wrist = arm();
  const angle = angles.reduce((sum, v) => sum + v, 0);

  return {
    x: wrist.x + 61 * Math.cos(angle),
    y: wrist.y + 61 * Math.sin(angle)
  };
}

function looseWire() {
  const p = tip();
  let nearest = -1;
  let best = 25;

  wires.forEach((wire, i) => {
    if (wire.connected) return;
    const d = dist(p, wire.pos);

    if (d < best) {
      best = d;
      nearest = i;
    }
  });

  return nearest;
}

function target() {
  if (cfg.mission === "rock") return rock;

  if (cfg.mission === "battery") {
    return phase === 0 ? {x: 552, y: 301} : battery;
  }

  if (phase === 0) return cover;
  if (phase === 1) return {x: 614, y: 282};
  if (phase === 2) return {x: 682, y: 325};
  if (phase === 3) return {x: switchX, y: 258};

  if (phase === 4) {
    const i = looseWire();
    return i < 0 ? {x: -999, y: -999} : wires[i].pos;
  }

  return antenna;
}

function reach() {
  if (done || held) return false;

  if (cfg.mission === "satellite" && phase === 4) {
    return looseWire() !== -1;
  }

  const radius =
    cfg.mission === "satellite" &&
    (phase === 1 || phase === 2) ? 17 : 26;

  return dist(tip(), target()) <= radius;
}

// ===== BACKGROUND =====

function background() {
  if (cfg.mission === "rock") {
    rect(0, 0, W, H, "#d7a57c");
    rect(0, 335, W, 165, "#c58c67");
    rect(0, 438, W, 62, "#a66f53");

    for (let i = 0; i < 17; i++) {
      dot(
        24 + i * 57,
        452 + (i % 3) * 9,
        3 + (i % 4),
        "#80533e"
      );
    }

    txt("MARS / SAMPLE ACQUISITION", 24, 33, 14, "#614537");
  } else {
    rect(0, 0, W, H, "#142c40");

    for (let x = 0; x < W; x += 145) {
      line(x, 0, x, H, "#27495d", 2);
    }

    for (let y = 0; y < H; y += 91) {
      line(0, y, W, y, "#27495d", 2);
    }

    rect(0, 446, W, 54, "#27475a");

    txt(
      cfg.mission === "battery"
        ? "ORBITAL BATTERY SERVICE"
        : "SATELLITE REPAIR / EXTERNAL PANEL",
      22, 32, 14, "#acd6e5"
    );
  }
}

function gauge(value, title) {
  rect(777, 55, 207, 65, "#20394b", 9);
  txt(title, 789, 76, 12, "#c4dbe4");
  rect(788, 90, 184, 13, "#435766", 6);
  rect(788, 90, 184 * clamp(value, 0, 1), 13, "#84d8a6", 6);
}

// ===== MISSION GRAPHICS =====

function rockScene() {
  rect(420, 216, 170, 117, "#8aafa1", 12);
  rect(438, 237, 136, 70, "#41675d", 10);
  rect(452, 248, 108, 47, "#2b5048", 8);

  txt("SAMPLE RECEIVER", 423, 204, 12, "#573e32");

  dot(
    rock.x, rock.y, 27,
    "#9e6349",
    reach() ? "#76e5a5" : "#ecc19b",
    reach() ? 5 : 3
  );
  dot(rock.x - 8, rock.y - 7, 7, "#bd8763");

  txt("SAMPLE", rock.x - 28, rock.y - 40, 12, "#593c33");
}

function batteryScene() {
  rect(505, 221, 282, 162, "#667f8c", 14);
  rect(524, 245, 244, 120, "#243c4e", 10);
  rect(552, 282, 193, 68, "#3d5b6c", 8);
  rect(552, 357, 193, 6, "#b3c5cd", 3);

  rect(
    539, 283, 26, 35,
    phase === 0
      ? (reach() ? "#85e6b3" : "#dc6664")
      : "#7ac6a5",
    5
  );

  txt(phase === 0 ? "LOCK" : "OPEN", 525, 267);

  rect(battery.x - 34, battery.y - 27, 70, 54, "#edc16b", 8);
  rect(battery.x - 27, battery.y - 19, 55, 10, "#f6dfae", 3);

  txt("Li-ion", battery.x - 25, battery.y + 10, 14, "#304453");

  gauge(phase === 0 ? 0 : progress, "배터리 분리 진행률");

  txt(
    phase === 0
      ? "① 잠금장치 해제"
      : "② 배터리를 오른쪽으로 당기기",
    500, 417
  );
}

function satelliteScene() {
  // 태양전지판
  rect(487, 214, 84, 140, "#315471", 5);
  rect(766, 214, 88, 140, "#315471", 5);

  for (let j = 0; j < 4; j++) {
    line(501 + j * 18, 220, 501 + j * 18, 346, "#6b9bb9", 2);
    line(780 + j * 18, 220, 780 + j * 18, 346, "#6b9bb9", 2);
    line(491, 238 + j * 29, 567, 238 + j * 29, "#6b9bb9", 2);
    line(770, 238 + j * 29, 850, 238 + j * 29, "#6b9bb9", 2);
  }

  // 위성 본체
  rect(557, 155, 225, 270, "#607e90", 14);
  rect(572, 173, 196, 230, "#244054", 10);

  txt(`STEP ${phase + 1}/6`, 585, 198, 15, "#9fd0df");
  txt(tasks[phase], 585, 222, 13);

  if (phase === 0) {
    rect(
      cover.x - 33, cover.y - 28, 66, 56,
      reach() ? "#8ae3b0" : "#d3aa78", 7
    );

    rect(
      cover.x - 22, cover.y - 17, 44, 34,
      "#e5c39b", 5
    );

    txt("COVER", cover.x - 27, cover.y - 40, 12);
  }

  else if (phase === 1 || phase === 2) {
    dot(
      614, 282, 17,
      phase === 1
        ? (reach() ? "#8df0b4" : "#db6864")
        : "#5a977e",
      "#d9e8ed", 3
    );

    dot(
      682, 325, 17,
      phase === 2
        ? (reach() ? "#8df0b4" : "#db6864")
        : "#577d87",
      "#d9e8ed", 3
    );

    txt("A", 608, 289);
    txt("B", 676, 332);
    txt(
      phase === 1 ? "버튼 A를 누르세요" : "버튼 B를 누르세요",
      586, 377
    );
  }

  else if (phase === 3) {
    rect(591, 252, 150, 9, "#acc1c8", 4);

    rect(
      switchX - 15, 236, 30, 30,
      reach() ? "#8fe9b6" : "#d4b37c", 5
    );

    txt("SLIDE RIGHT", 592, 292);
  }

  else if (phase === 4) {
    wires.forEach(w => {
      line(w.home.x - 27, w.home.y, w.pos.x, w.pos.y, w.color, 5);

      dot(w.socket.x, w.socket.y, 13, "#1b3042", w.color, 5);

      dot(
        w.pos.x, w.pos.y, 10,
        w.connected ? "#92e7b8" : w.color,
        "#e7eef2", 2
      );
    });

    txt("같은 색 소켓에 연결", 578, 389, 12);
  }

  else if (phase === 5) {
    line(600, 354, antenna.x, antenna.y, "#d4b579", 12);

    dot(
      antenna.x, antenna.y, 15,
      reach() ? "#80e6ab" : "#d6b579",
      "#e8e5d3", 3
    );

    dot(dock.x, dock.y, 14, "#263f4f", "#82eeb1", 4);
    txt("DOCK", dock.x - 17, dock.y - 24, 12);

    txt("안테나를 도킹 위치에 고정", 579, 388, 12);
  }

  const connected = wires.filter(w => w.connected).length;

  const value =
    phase / 6 +
    (phase === 4 ? connected / 24 : 0);

  gauge(value, "위성 정비 진행률");
}

// ===== ARM GRAPHICS =====

function drawArm() {
  const wrist = arm();

  rect(54, 423, 128, 57, "#293f50", 7);
  rect(75, 439, 87, 10, "#7397a2", 3);

  for (let i = 0; i < 3; i++) {
    const a = points[i];
    const b = points[i + 1];

    line(a.x + 5, a.y + 5, b.x + 5, b.y + 5, "#263846", 35);
    line(a.x, a.y, b.x, b.y, "#405e6e", 30);
    line(a.x, a.y, b.x, b.y, "#abc4c9", 19);
    line(a.x + 4, a.y - 4, b.x + 4, b.y - 4, "#ede5d8", 4);

    dot(
      a.x + (b.x - a.x) * .32,
      a.y + (b.y - a.y) * .32,
      6, "#e9a875", "#405564", 2
    );
  }

  for (let i = 0; i < 3; i++) {
    const p = points[i];

    dot(p.x, p.y, 20, "#324b5b", "#dce9ec", 4);

    dot(
      p.x, p.y, 13,
      drag === i ? "#ffcb69" : "#da6d62",
      "#2c4150", 3
    );

    dot(p.x, p.y, 3, "#fff7df");
    txt("J" + (i + 1), p.x - 11, p.y - 26, 12);
  }

  const angle = angles.reduce((s, v) => s + v, 0);

  ctx.save();
  ctx.translate(wrist.x, wrist.y);
  ctx.rotate(angle);

  rect(-4, -15, 37, 30, "#425e6d", 6);
  rect(21, -10, 23, 20, "#c1d5d5", 4);

  const gap = held ? 7 : 19;

  line(43, -gap, 56, -gap, "#d9e7e6", 9);
  line(43, gap, 56, gap, "#d9e7e6", 9);

  line(56, -gap, 70, -gap + 9, "#e49b72", 7);
  line(56, gap, 70, gap - 9, "#e49b72", 7);

  ctx.restore();

  const p = tip();

  dot(
    p.x, p.y, 5,
    reach() ? "#66f1a8" : "#f6c67a",
    "#183443", 2
  );
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  background();

  if (cfg.mission === "rock") rockScene();
  else if (cfg.mission === "battery") batteryScene();
  else satelliteScene();

  drawArm();

  txt(
    "관절 선택 → 원형으로 드래그",
    20, 68, 13,
    cfg.mission === "rock" ? "#5c3b30" : "#b8dbe7"
  );

  if (reach()) {
    txt(
      "● 접촉했습니다! 집게 버튼을 누르세요",
      20, 92, 13,
      cfg.mission === "rock" ? "#317650" : "#88e8b1"
    );
  }
}

// ===== GAME PROGRESSION =====

function finish(success) {
  if (done) return;
  done = true;
  held = false;

  const out = document.getElementById("outcome");

  out.textContent = success ? "SUCCESS" : "FAILED";
  out.style.color = success ? "#a1efbb" : "#fc8179";

  document.getElementById("detail").textContent =
    success
      ? "임무를 성공적으로 완료했습니다."
      : "제한시간이 종료되었습니다.";

  document.getElementById("overlay").classList.add("show");
}

function next() {
  held = false;
  offset = {x: 0, y: 0};
  wireIndex = -1;
  phase++;

  if (phase >= 6) finish(true);
  else tell("다음 작업: " + tasks[phase]);
}

function action() {
  if (done) return;

  const p = tip();

  // 배터리 잠금장치
  if (cfg.mission === "battery" && phase === 0) {
    if (!reach()) {
      tell("잠금장치에 집게 끝을 정확히 맞춰 주세요.");
      return;
    }

    phase = 1;
    tell("잠금 해제 완료! 배터리를 집고 오른쪽으로 당기세요.");
    return;
  }

  // 위성 버튼 A와 B
  if (
    cfg.mission === "satellite" &&
    (phase === 1 || phase === 2)
  ) {
    if (!reach()) {
      tell("버튼 중앙에 집게 끝을 맞춰야 합니다.");
      return;
    }

    next();
    return;
  }

  if (!held) {
    if (!reach()) {
      tell("집게 끝을 목표에 더 정확히 맞춰 주세요.");
      return;
    }

    held = true;

    if (cfg.mission === "satellite" && phase === 4) {
      wireIndex = looseWire();

      if (wireIndex < 0) {
        held = false;
        tell("전선 끝에 집게를 맞춰 주세요.");
        return;
      }

      const w = wires[wireIndex];

      offset = {
        x: w.pos.x - p.x,
        y: w.pos.y - p.y
      };

      tell("전선을 집었습니다. 같은 색 소켓으로 옮기세요.");
      return;
    }

    const t = target();

    offset = {
      x: t.x - p.x,
      y: t.y - p.y
    };

    tell("물체를 집었습니다. 이동한 뒤 다시 눌러 놓으세요.");
    return;
  }

  held = false;

  // 화성 암석 놓기
  if (cfg.mission === "rock") {
    if (
      rock.x > 458 && rock.x < 560 &&
      rock.y > 243 && rock.y < 307
    ) {
      finish(true);
    } else {
      tell("암석을 샘플 보관함 내부에 놓으세요.");
    }
    return;
  }

  if (cfg.mission === "battery") {
    tell("배터리를 놓았습니다.");
    return;
  }

  // 위성 보호 덮개
  if (phase === 0) {
    if (cover.x < 555) next();
    else tell("덮개를 왼쪽으로 더 옮기세요.");
    return;
  }

  // 슬라이드 스위치
  if (phase === 3) {
    if (switchX >= 715) next();
    else tell("스위치를 오른쪽 끝까지 옮기세요.");
    return;
  }

  // 네 가지 전선 연결
  if (phase === 4) {
    const w = wires[wireIndex];

    if (!w) return;

    if (dist(w.pos, w.socket) <= 19) {
      w.pos = {...w.socket};
      w.connected = true;

      if (wires.every(item => item.connected)) {
        next();
      } else {
        tell("전선 연결 성공! 남은 색상도 연결하세요.");
      }
    } else {
      w.pos = {...w.home};
      tell("소켓에 정확히 연결하지 못했습니다. 다시 시도하세요.");
    }

    wireIndex = -1;
    return;
  }

  // 안테나 도킹
  if (phase === 5) {
    if (dist(antenna, dock) <= 19) next();
    else tell("안테나 끝을 초록색 도킹 지점에 맞춰 주세요.");
  }
}

// ===== MOUSE CONTROL =====

function mouse(e) {
  const r = canvas.getBoundingClientRect();

  return {
    x: (e.clientX - r.left) * W / r.width,
    y: (e.clientY - r.top) * H / r.height
  };
}

canvas.addEventListener("pointerdown", e => {
  if (done) return;

  const p = mouse(e);
  arm();

  drag = -1;
  let best = 43;

  for (let i = 0; i < 3; i++) {
    const d = dist(p, points[i]);

    if (d < best) {
      best = d;
      drag = i;
    }
  }

  if (drag >= 0) {
    lastPointer = p;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove", e => {
  if (done || drag < 0 || !lastPointer) return;

  const p = mouse(e);
  const pivot = points[drag];

  const before = Math.atan2(
    lastPointer.y - pivot.y,
    lastPointer.x - pivot.x
  );

  const after = Math.atan2(
    p.y - pivot.y,
    p.x - pivot.x
  );

  const delta = Math.atan2(
    Math.sin(after - before),
    Math.cos(after - before)
  );

  angles[drag] = clamp(
    angles[drag] + delta * sensitivity[drag],
    -2.85, 2.85
  );

  lastPointer = p;
  draw();
});

for (const event of [
  "pointerup",
  "pointercancel",
  "lostpointercapture"
]) {
  canvas.addEventListener(event, () => {
    drag = -1;
    lastPointer = null;
  });
}

// ===== TIMER AND MOVEMENT =====

function tick(now) {
  const dt = clamp((now - last) / 1000, 0, .05);
  last = now;

  if (!done) {
    const remaining = Math.max(
      0,
      Math.ceil(duration - (now - started) / 1000)
    );

    clock.textContent =
      String(Math.floor(remaining / 60)).padStart(2, "0")
      + ":"
      + String(remaining % 60).padStart(2, "0");

    clock.classList.toggle("red", remaining <= 60);

    if (remaining === 0) finish(false);

    if (held && !done) {
      const p = tip();

      if (cfg.mission === "rock") {
        rock = {
          x: p.x + offset.x,
          y: p.y + offset.y
        };
      }

      else if (cfg.mission === "battery") {
        const desired = clamp(p.x + offset.x, 608, 718);

        battery.x += clamp(
          desired - battery.x,
          -95 * dt,
          95 * dt
        );

        progress = clamp((battery.x - 608) / 110, 0, 1);

        if (progress >= .995) finish(true);
      }

      else if (cfg.mission === "satellite") {
        if (phase === 0) {
          cover = {
            x: p.x + offset.x,
            y: p.y + offset.y
          };
        }

        else if (phase === 3) {
          switchX = clamp(p.x + offset.x, 595, 730);
        }

        else if (phase === 4 && wireIndex >= 0) {
          wires[wireIndex].pos = {
            x: p.x + offset.x,
            y: p.y + offset.y
          };
        }

        else if (phase === 5) {
          antenna = {
            x: p.x + offset.x,
            y: p.y + offset.y
          };
        }
      }
    }
  }

  draw();
  requestAnimationFrame(tick);
}

// ===== RESTART =====

function restart() {
  angles = [-1.08, .48, .53];

  drag = -1;
  lastPointer = null;
  held = false;
  done = false;
  phase = 0;
  wireIndex = -1;

  offset = {x: 0, y: 0};

  rock = {x: 770, y: 392};
  battery = {x: 608, y: 315};
  cover = {x: 654, y: 308};
  switchX = 595;
  progress = 0;

  wires = [
    {
      color: "#61b9fc",
      home: {x: 581, y: 340},
      pos: {x: 581, y: 340},
      socket: {x: 725, y: 272},
      connected: false
    },
    {
      color: "#63d58f",
      home: {x: 612, y: 306},
      pos: {x: 612, y: 306},
      socket: {x: 693, y: 345},
      connected: false
    },
    {
      color: "#f3c75b",
      home: {x: 575, y: 372},
      pos: {x: 575, y: 372},
      socket: {x: 722, y: 307},
      connected: false
    },
    {
      color: "#e96562",
      home: {x: 607, y: 256},
      pos: {x: 607, y: 256},
      socket: {x: 692, y: 237},
      connected: false
    }
  ];

  antenna = {x: 652, y: 312};

  started = performance.now();
  last = started;

  document.getElementById("overlay").classList.remove("show");

  clock.textContent =
    String(Math.floor(duration / 60)).padStart(2, "0")
    + ":"
    + String(duration % 60).padStart(2, "0");

  clock.classList.remove("red");

  if (cfg.mission === "satellite") {
    tell("6단계: 덮개 → 버튼 A → 버튼 B → 스위치 → 전선 → 안테나");
  } else {
    tell("집게 끝을 목표에 맞추고 버튼을 눌러 작업하세요.");
  }

  draw();
}

document.getElementById("action").onclick = action;
document.getElementById("restart").onclick = restart;
document.getElementById("retry").onclick = restart;

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    action();
  }
});

window.addEventListener("resize", () => {
  fit();
  draw();
});

fit();
restart();
requestAnimationFrame(tick);
</script>
</body>
