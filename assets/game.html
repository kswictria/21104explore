
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151e29;
  color: #f4ebdf;
  font-family: system-ui, "Malgun Gothic", sans-serif;
}

#wrapper {
  position: relative;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #1e2b38;
  border: 1px solid #3c4b58;
  border-radius: 12px 12px 0 0;
}

.muted {
  font-size: 12px;
  color: #b1c1c7;
}

#time {
  font-size: 26px;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  color: #f5ce8d;
}

#time.warning {
  color: #ff5e59;
  animation: pulse 0.7s infinite alternate;
}

@keyframes pulse {
  to { opacity: 0.55; }
}

#stage {
  display: block;
  width: 100%;
  height: 500px;
  background: #f0e6d3;
  touch-action: none;
  cursor: crosshair;
}

#panel {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: #1e2b38;
  border: 1px solid #3c4b58;
  border-radius: 0 0 12px 12px;
}

button {
  padding: 10px 14px;
  color: white;
  background: #304456;
  border: 1px solid #8a9da9;
  border-radius: 8px;
  cursor: pointer;
}

button.primary {
  background: #cb7750;
  border-color: #e0a17b;
}

#prompt {
  flex: 1;
  min-width: 180px;
  font-size: 13px;
}

#modal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #0a101ac9;
  z-index: 10;
}

#modal.show {
  display: flex;
}

.modalBox {
  min-width: 280px;
  padding: 30px;
  text-align: center;
  background: #223342;
  border: 1px solid #d2a078;
  border-radius: 18px;
}

.modalBox h1 {
  font-size: 38px;
}
</style>
</head>

<body>

<div id="wrapper">

  <div class="top">
    <div>
      <strong id="title">MECHA LAB</strong>
      <div class="muted">
        빨간 관절을 잡고 회전 · 대상 가까이에서 잡기/놓기
      </div>
    </div>

    <div id="time">03:00</div>
  </div>

  <canvas id="stage"></canvas>

  <div id="panel">
    <button class="primary" id="grab">
      잡기 / 놓기 (Space)
    </button>

    <button id="reset">
      미션 재시작
    </button>

    <div id="prompt">
      준비 완료
    </div>
  </div>

  <div id="modal">
    <div class="modalBox">
      <h1 id="outcome">SUCCESS</h1>
      <p id="detail"></p>

      <button class="primary" id="again">
        다시 도전
      </button>
      <p class="muted">
        미션 선택으로 돌아가려면 게임 아래의
        돌아가기 버튼을 누르세요.
      </p>
    </div>
  </div>

</div>

<script>
const cfg = __GAME_CONFIG__;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const timer = document.getElementById("time");
const promptBox = document.getElementById("prompt");

document.getElementById("title").textContent = cfg.title;

const W = 1000;
const H = 500;

let active = -1;
let finished = false;
let gripping = false;
let phase = 0;
let progress = 0;

let started = performance.now();
let last = started;

let rock = {x: 780, y: 413};
let battery = {x: 790, y: 330};
let barrier = {x: 782, y: 375};
let switchX = 823;

const root = {x: 145, y: 440};

const lens = [245, 300, 250];
let angles = [-1.15, 0.65, 0.5];

// 관절마다 다른 회전 민감도
const sensitivity = [0.58, 0.85, 1.22];

let joints = [];

function resize() {
  const w = canvas.clientWidth || 1000;
  const ratio = window.devicePixelRatio || 1;

  canvas.width = Math.round(w * ratio);
  canvas.height = Math.round(500 * ratio);

  ctx.setTransform(
    canvas.width / W, 0,
    0, canvas.height / H,
    0, 0
  );
}

window.addEventListener("resize", resize);
resize();

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// 순기구학: 관절 각도로 말단 위치 계산
function forwardKinematics() {
  joints = [{...root}];

  let a = 0;

  for (let i = 0; i < 3; i++) {
    a += angles[i];

    const p = joints[joints.length - 1];

    joints.push({
      x: p.x + Math.cos(a) * lens[i],
      y: p.y + Math.sin(a) * lens[i]
    });
  }

  return joints[3];
}

function target() {
  if (cfg.mission === "rock") return rock;
  if (cfg.mission === "battery") return battery;

  if (phase === 0) return barrier;
  if (phase === 1) return {x: 830, y: 317};

  return {x: switchX, y: 255};
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const mars = cfg.mission === "rock";

  // 미션별 배경
  ctx.fillStyle = mars ? "#f4e1c4" : "#d9e5e8";
  ctx.fillRect(0, 0, W, H);

  if (mars) {
    ctx.fillStyle = "#e1b78d";
    ctx.beginPath();
    ctx.moveTo(0, 390);
    ctx.quadraticCurveTo(300, 375, 530, 398);
    ctx.quadraticCurveTo(750, 367, 1000, 397);
    ctx.lineTo(1000, 500);
    ctx.lineTo(0, 500);
    ctx.fill();

    ctx.strokeStyle = "#b88963";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 450);
    ctx.lineTo(1000, 450);
    ctx.stroke();
  } else {
    ctx.fillStyle = "#9eb3c1";
    ctx.fillRect(0, 455, W, 45);

    for (let x = 25; x < W; x += 75) {
      ctx.strokeStyle = "#c3d1d9";
      ctx.strokeRect(x, 35, 60, 55);
    }
  }

  const tip = forwardKinematics();

  // 로봇팔 고정대
  ctx.fillStyle = "#293b46";
  ctx.fillRect(80, 438, 120, 55);

  // 로봇팔 링크 3개
  for (let i = 0; i < 3; i++) {
    const a = joints[i];
    const b = joints[i + 1];

    ctx.lineCap = "round";

    ctx.strokeStyle = "#314857";
    ctx.lineWidth = 28;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    ctx.strokeStyle = "#a7bbc4";
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // 선택 가능한 관절
  for (let i = 0; i < 3; i++) {
    const p = joints[i];

    ctx.beginPath();
    ctx.fillStyle =
      active === i ? "#ffcf5b" : "#da6b57";

    ctx.strokeStyle = "#fff2df";
    ctx.lineWidth = 4;

    ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#364350";
    ctx.font = "12px system-ui";
    ctx.fillText("J" + (i + 1), p.x - 8, p.y - 23);
  }

  // 말단 그리퍼
  ctx.save();
  ctx.translate(tip.x, tip.y);

  const a = angles.reduce((sum, x) => sum + x, 0);
  ctx.rotate(a);

  ctx.strokeStyle = "#243d4c";
  ctx.lineWidth = 9;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(20, 0);
  ctx.moveTo(18, 0);
  ctx.lineTo(33, -14);
  ctx.moveTo(18, 0);
  ctx.lineTo(33, 14);
  ctx.stroke();

  ctx.restore();

  // 미션 1: 화성 암석
  if (mars) {
    ctx.fillStyle = "#b67e60";
    ctx.strokeStyle = "#704832";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.ellipse(
      rock.x, rock.y,
      29, 22, 0.2, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "#87b89f";
    ctx.setLineDash([7, 5]);
    ctx.strokeRect(700, 330, 110, 65);
    ctx.setLineDash([]);

    ctx.fillStyle = "#45535b";
    ctx.font = "14px system-ui";
    ctx.fillText("DROP ZONE", 707, 324);
  }

  // 미션 2: 배터리 분리
  else if (cfg.mission === "battery") {
    ctx.fillStyle = "#536a79";
    ctx.fillRect(746, 298, 150, 73);

    ctx.fillStyle = "#efc365";
    ctx.fillRect(
      battery.x - 24,
      battery.y - 20,
      48, 40
    );

    ctx.fillStyle = "#fdf3dc";
    ctx.fillText("BATTERY", 758, 289);

    ctx.fillStyle = "#374854";
    ctx.fillRect(740, 270, 164, 12);

    ctx.fillStyle = "#75c9a8";
    ctx.fillRect(
      740, 270,
      Math.min(164, progress / 110 * 164),
      12
    );
  }

  // 미션 3: 위성 수리
  else {
    if (phase === 0) {
      ctx.fillStyle = "#566b77";
      ctx.fillRect(
        barrier.x - 31,
        barrier.y - 28,
        62, 56
      );

      ctx.fillStyle = "#f5e2ca";
      ctx.fillText("REMOVE", 754, 334);
    } else {
      ctx.fillStyle = "#93b3c0";
      ctx.fillRect(755, 290, 165, 105);

      ctx.fillStyle =
        phase === 1 ? "#d86751" : "#5da98a";

      ctx.beginPath();
      ctx.arc(830, 317, 17, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e4c877";
      ctx.fillRect(switchX - 10, 245, 20, 25);

      ctx.fillStyle = "#364651";
      ctx.fillText("SWITCH", 785, 230);
    }
  }

  ctx.fillStyle = "#263d4c";
  ctx.font = "bold 15px system-ui";

  const areaName =
    cfg.mission === "rock" ? "MARS SURFACE" :
    cfg.mission === "battery" ? "STATION SERVICE BAY" :
    "SATELLITE PANEL";

  ctx.fillText(areaName, 22, 30);

  if (cfg.mission === "satellite") {
    const text = [
      "STEP 1: 장애물 제거",
      "STEP 2: 버튼 누르기",
      "STEP 3: 스위치 당기기"
    ];

    ctx.fillText(text[phase] || "완료", 690, 65);
  }
}

function endMission(win) {
  if (finished) return;

  finished = true;

  document.getElementById("modal")
    .classList.add("show");

  const title = document.getElementById("outcome");

  title.textContent = win ? "SUCCESS" : "FAILED";
  title.style.color = win ? "#8cdfb0" : "#ff7777";

  document.getElementById("detail").textContent =
    win
      ? "미션을 성공적으로 완료했습니다."
      : "제한시간이 종료되었습니다.";
}

function grip() {
  if (finished) return;

  const tip = forwardKinematics();
  const t = target();

  // 위성 수리: 버튼 누르기
  if (cfg.mission === "satellite" && phase === 1) {
    if (distance(tip, t) < 42) {
      phase = 2;
      promptBox.textContent =
        "버튼 작동 완료! 스위치를 잡고 오른쪽으로 당기세요.";
    } else {
      promptBox.textContent =
        "그리퍼를 버튼에 더 가까이 이동하세요.";
    }
    return;
  }

  if (!gripping) {
    if (distance(tip, t) < 65) {
      gripping = true;
      promptBox.textContent =
        "대상을 잡았습니다. 관절을 돌려 이동하세요.";
    } else {
      promptBox.textContent =
        "대상과 거리가 멀어요. 관절을 조절하세요.";
    }
  } else {
    gripping = false;

    if (cfg.mission === "rock") {
      if (
        rock.x > 700 && rock.x < 810 &&
        rock.y > 330 && rock.y < 395
      ) {
        endMission(true);
      } else {
        promptBox.textContent =
          "녹색 목표 구역 안에 놓아 주세요.";
      }
    }

    if (cfg.mission === "satellite" && phase === 0) {
      if (barrier.x < 685) {
        phase = 1;
        promptBox.textContent =
          "장애물 제거 완료! 이제 버튼을 누르세요.";
      } else {
        promptBox.textContent =
          "장애물을 왼쪽으로 더 옮겨 주세요.";
      }
    }
  }
}

// 관절 선택
canvas.addEventListener("pointerdown", e => {
  if (finished) return;

  const rect = canvas.getBoundingClientRect();

  const p = {
    x: (e.clientX - rect.left) * W / rect.width,
    y: (e.clientY - rect.top) * H / rect.height
  };

  forwardKinematics();

  let best = 36;
  active = -1;

  for (let i = 0; i < 3; i++) {
    const d = distance(p, joints[i]);

    if (d < best) {
      best = d;
      active = i;
    }
  }

  if (active >= 0) {
    canvas.setPointerCapture(e.pointerId);
  }
});

// 마우스 드래그에 따른 회전
canvas.addEventListener("pointermove", e => {
  if (active < 0 || finished) return;

  const rect = canvas.getBoundingClientRect();

  const p = {
    x: (e.clientX - rect.left) * W / rect.width,
    y: (e.clientY - rect.top) * H / rect.height
  };

  const pivot = joints[active];

  const absolute = Math.atan2(
    p.y - pivot.y,
    p.x - pivot.x
  );

  let previous = 0;

  for (let i = 0; i < active; i++) {
    previous += angles[i];
  }

  const wanted = absolute - previous;

  const delta = Math.atan2(
    Math.sin(wanted - angles[active]),
    Math.cos(wanted - angles[active])
  );

  angles[active] = Math.max(
    -2.8,
    Math.min(
      2.8,
      angles[active] + delta * sensitivity[active]
    )
  );

  draw();
});

canvas.addEventListener("pointerup", () => {
  active = -1;
});

canvas.addEventListener("pointercancel", () => {
  active = -1;
});

// 잡기 버튼
document.getElementById("grab").onclick = grip;

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    grip();
  }
});

// 게임 타이머 및 물체 이동
function update(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!finished) {
    const remaining = Math.max(
      0,
      Math.ceil(cfg.duration - (now - started) / 1000)
    );

    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timer.textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");

    timer.classList.toggle(
      "warning",
      remaining <= 60
    );

    if (remaining <= 0) {
      endMission(false);
    }

    if (gripping && !finished) {
      const tip = forwardKinematics();

      if (cfg.mission === "rock") {
        rock.x = tip.x + 32;
        rock.y = tip.y + 6;
      }

      else if (cfg.mission === "battery") {
        battery.x = Math.max(790, tip.x + 25);
        battery.y = 330;

        progress = Math.max(
          progress,
          battery.x - 790
        );

        if (progress >= 110) {
          endMission(true);
        }
      }

      else if (phase === 0) {
        barrier.x = tip.x + 25;
        barrier.y = tip.y + 8;
      }

      else if (phase === 2) {
        switchX = Math.max(823, tip.x + 24);

        if (switchX >= 935) {
          endMission(true);
        }
      }
    }
  }

  draw();
  requestAnimationFrame(update);
}

// 미션 재시작
function restart() {
  angles = [-1.15, 0.65, 0.5];

  started = performance.now();
  last = started;

  finished = false;
  gripping = false;
  active = -1;
  phase = 0;
  progress = 0;

  rock = {x: 780, y: 413};
  battery = {x: 790, y: 330};
  barrier = {x: 782, y: 375};
  switchX = 823;

  document.getElementById("modal")
    .classList.remove("show");

  promptBox.textContent =
    "관절을 움직여 미션을 시작하세요.";
}

document.getElementById("reset").onclick = restart;
document.getElementById("again").onclick = restart;

restart();
requestAnimationFrame(update);
</script>

</body>
</html>
