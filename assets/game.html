<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#101924;color:#edf4f5;font:14px system-ui,'Malgun Gothic',sans-serif}#app{position:relative;overflow:hidden;border:1px solid #385164;border-radius:14px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#172b3d}footer{justify-content:flex-start;flex-wrap:wrap}small{display:block;color:#99c5d5;font:bold 11px monospace;letter-spacing:2px}h2{margin:4px 0;font-size:20px}#clock{font:bold 30px monospace;color:#ffd087}#clock.red{color:#ff6767}canvas{display:block;width:100%;aspect-ratio:2/1;touch-action:none}button{padding:11px 14px;color:white;background:#344d60;border:1px solid #708c9c;border-radius:9px;font-weight:bold;cursor:pointer}button.primary{background:#d88a60;color:#182431}#hint{flex:1;min-width:220px;color:#d3dfe2;font-size:13px}#overlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#07121cbf;z-index:4}#overlay.show{display:flex}.dialog{padding:30px;text-align:center;background:#22394b;border:1px solid #9bb9c5;border-radius:17px;max-width:90%}.dialog h1{font-size:43px}
</style></head><body><div id="app"><header><div><small>MECHA LAB / MISSION CONTROL</small><h2 id="title"></h2></div><div style="text-align:right"><small>TIME REMAINING</small><div id="clock"></div></div></header><canvas id="game"></canvas><footer><button id="action" class="primary">집게 닫기 / 열기 (Space)</button><button id="reset">다시 시작</button><div id="hint"></div></footer><div id="overlay"><div class="dialog"><small>MISSION REPORT</small><h1 id="outcome"></h1><p id="detail"></p><button class="primary" id="retry">다시 도전</button><p>미션 선택 화면으로 돌아가려면 게임 아래 버튼을 이용하세요.</p></div></div></div>
<script>
const cfg=__GAME_CONFIG__;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1000,H=500,base={x:115,y:430},lens=[222,241,194],sens=[.53,.78,1.08];
const clock=document.getElementById('clock'),hint=document.getElementById('hint');
document.getElementById('title').textContent=cfg.title;
const duration=cfg.mission==='rock'?90:cfg.mission==='battery'?120:240;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const tasks=['보호 덮개 제거','버튼 A 누르기','버튼 B 누르기','슬라이드 스위치 작동','4색 전선 연결','움직이는 전파 지점에 안테나 정렬'];
let angles,points,drag,lastMouse,held,done,phase,offset,rock,battery,cover,switchX,progress,wires,wireIndex,antenna;
let start,last,sceneTime,outcome,endStart,particles,broken,baseAngles,rockVelocity,rockGrounded,rockLifted;
const message=s=>hint.textContent=s;
function size(){let r=devicePixelRatio||1;canvas.width=Math.round(canvas.clientWidth*r);canvas.height=Math.round(canvas.clientWidth*r*.5);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
function box(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function line(x,y,X,Y,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}
function dot(x,y,r,c,b='',bw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(b){ctx.strokeStyle=b;ctx.lineWidth=bw;ctx.stroke()}}
function text(s,x,y,z=13,c='#e5eff1'){ctx.fillStyle=c;ctx.font=`bold ${z}px system-ui`;ctx.fillText(s,x,y)}
function joints(aa=angles){let out=[{...base}],a=0;for(let i=0;i<3;i++){a+=aa[i];let p=out[i];out.push({x:p.x+lens[i]*Math.cos(a),y:p.y+lens[i]*Math.sin(a)})}return out}
function tip(aa=angles){let ps=joints(aa),a=aa.reduce((s,v)=>s+v,0),p=ps[3];return{x:p.x+61*Math.cos(a),y:p.y+61*Math.sin(a)}}
function signal(){return{x:695+29*Math.sin(sceneTime*1.4),y:184+18*Math.cos(sceneTime*1.8)}}
function looseWire(){let p=tip(),idx=-1,best=25;wires.forEach((w,i)=>{if(w.connected)return;let d=dist(p,w.pos);if(d<best){best=d;idx=i}});return idx}
function target(){if(cfg.mission==='rock')return rock;if(cfg.mission==='battery')return phase===0?{x:552,y:301}:battery;if(phase===0)return cover;if(phase===1)return{x:614,y:282};if(phase===2)return{x:682,y:325};if(phase===3)return{x:switchX,y:258};if(phase===4){let i=looseWire();return i<0?{x:-999,y:-999}:wires[i].pos}return antenna}
function canReach(){if(done||held)return false;if(cfg.mission==='satellite'&&phase===4)return looseWire()>=0;let rad=cfg.mission==='satellite'&&(phase===1||phase===2)?17:26;return dist(tip(),target())<=rad}
function background(){if(cfg.mission==='rock'){box(0,0,W,H,'#d7a57c');box(0,335,W,165,'#c58c67');box(0,438,W,62,'#a66f53');for(let i=0;i<17;i++)dot(24+i*57,452+(i%3)*9,3+(i%4),'#80533e');text('MARS / SAMPLE ACQUISITION',24,33,14,'#614537')}else{box(0,0,W,H,'#12283d');for(let i=0;i<50;i++){let x=(i*83+sceneTime*(5+i%7))%1040-20,y=(i*69)%430+10;dot(x,y,i%4===0?2:1,'#d5eafa')}if(cfg.mission==='satellite'){let px=876+12*Math.sin(sceneTime*.22),py=112+9*Math.cos(sceneTime*.2);dot(px,py,45,'#667ac8');dot(px-12,py-9,14,'#71c7c8');ctx.strokeStyle='#bbc3ff90';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(px,py,62,15,-.2,0,Math.PI*2);ctx.stroke()}for(let x=0;x<W;x+=145)line(x,0,x,H,'#26485d',1.5);for(let y=0;y<H;y+=91)line(0,y,W,y,'#26485d',1.5);box(0,446,W,54,'#27475a');text(cfg.mission==='battery'?'ORBITAL BATTERY SERVICE':'SATELLITE REPAIR / EXTERNAL PANEL',22,32,14,'#acd6e5')}}
function gauge(v,title){box(777,55,207,65,'#20394b',9);text(title,789,76,12,'#c4dbe4');box(788,90,184,13,'#435766',6);box(788,90,184*clamp(v,0,1),13,'#84d8a6',6)}
function scenes(){if(cfg.mission==='rock'){box(420,216,170,117,'#8aafa1',12);box(438,237,136,70,'#41675d',10);box(452,248,108,47,'#2b5048',8);text('SAMPLE RECEIVER',423,204,12,'#573e32');dot(rock.x,rock.y,27,'#9e6349',canReach()?'#76e5a5':'#ecc19b',canReach()?5:3);dot(rock.x-8,rock.y-7,7,'#bd8763');text('SAMPLE',rock.x-28,rock.y-40,12,'#593c33');if(!held&&rockLifted&&!rockGrounded)text('FALLING',rock.x-24,rock.y-55,11,'#ffecbf');return}
if(cfg.mission==='battery'){box(505,221,282,162,'#667f8c',14);box(524,245,244,120,'#243c4e',10);box(552,282,193,68,'#3d5b6c',8);box(552,357,193,6,'#b3c5cd',3);box(539,283,26,35,phase===0?(canReach()?'#85e6b3':'#dc6664'):'#7ac6a5',5);text(phase===0?'LOCK':'OPEN',525,267);box(battery.x-34,battery.y-27,70,54,'#edc16b',8);box(battery.x-27,battery.y-19,55,10,'#f6dfae',3);text('Li-ion',battery.x-25,battery.y+10,14,'#304453');gauge(phase===0?0:progress,'배터리 분리 진행률');text(phase===0?'① 잠금장치 해제':'② 배터리를 오른쪽으로 당기기',500,417);return}
box(487,214,84,140,'#315471',5);box(766,214,88,140,'#315471',5);for(let j=0;j<4;j++){line(501+j*18,220,501+j*18,346,'#6b9bb9',2);line(780+j*18,220,780+j*18,346,'#6b9bb9',2);line(491,238+j*29,567,238+j*29,'#6b9bb9',2);line(770,238+j*29,850,238+j*29,'#6b9bb9',2)}box(557,155,225,270,'#607e90',14);box(572,173,196,230,'#244054',10);text(`STEP ${phase+1}/6`,585,198,15,'#9fd0df');text(tasks[phase],585,222);
if(phase===0){box(cover.x-33,cover.y-28,66,56,canReach()?'#8ae3b0':'#d3aa78',7);box(cover.x-22,cover.y-17,44,34,'#e5c39b',5);text('COVER',cover.x-27,cover.y-40)}
else if(phase===1||phase===2){dot(614,282,17,phase===1?(canReach()?'#8df0b4':'#db6864'):'#5a977e','#d9e8ed',3);dot(682,325,17,phase===2?(canReach()?'#8df0b4':'#db6864'):'#577d87','#d9e8ed',3);text('A',608,289);text('B',676,332);text(phase===1?'버튼 A를 누르세요':'버튼 B를 누르세요',586,377)}
else if(phase===3){box(591,252,150,9,'#acc1c8',4);box(switchX-15,236,30,30,canReach()?'#8fe9b6':'#d4b37c',5);text('SLIDE RIGHT',592,292)}
else if(phase===4){wires.forEach(w=>{line(w.home.x-27,w.home.y,w.pos.x,w.pos.y,w.color,5);dot(w.socket.x,w.socket.y,13,'#1b3042',w.color,5);dot(w.pos.x,w.pos.y,10,w.connected?'#92e7b8':w.color,'#e7eef2',2)});text('같은 색 소켓에 연결',578,389,12)}
else{let node=signal();line(600,354,antenna.x,antenna.y,'#d4b579',12);dot(antenna.x,antenna.y,15,dist(antenna,node)<=22?'#80e6ab':'#d6b579','#e8e5d3',3);dot(node.x,node.y,12,'#203f50','#82eeb1',4);for(let i=0;i<3;i++){ctx.strokeStyle=`rgba(130,238,177,${.5-i*.12})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(node.x,node.y,18+i*13+(sceneTime*12)%13,-.9,.9);ctx.stroke()}text('MOVING SIGNAL',node.x-45,node.y-26,12,'#a5f1c1')}
let connected=wires.filter(w=>w.connected).length;gauge(phase/6+(phase===4?connected/24:0),'위성 정비 진행률')}
function armGraphic(aa=angles){let ps=joints(aa);box(54,423,128,57,'#293f50',7);box(75,439,87,10,'#7397a2',3);for(let i=0;i<3;i++){let a=ps[i],b=ps[i+1];line(a.x+5,a.y+5,b.x+5,b.y+5,'#263846',35);line(a.x,a.y,b.x,b.y,'#405e6e',30);line(a.x,a.y,b.x,b.y,'#abc4c9',19);line(a.x+4,a.y-4,b.x+4,b.y-4,'#ede5d8',4);dot(a.x+(b.x-a.x)*.32,a.y+(b.y-a.y)*.32,6,'#e9a875','#405564',2)}for(let i=0;i<3;i++){let p=ps[i];dot(p.x,p.y,20,'#324b5b','#dce9ec',4);dot(p.x,p.y,13,drag===i?'#ffcb69':'#da6d62','#2c4150',3);dot(p.x,p.y,3,'#fff7df');text('J'+(i+1),p.x-11,p.y-26,12)}let a=aa.reduce((s,v)=>s+v,0),p=ps[3];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);box(-4,-15,37,30,'#425e6d',6);box(21,-10,23,20,'#c1d5d5',4);let gap=held?7:19;line(43,-gap,56,-gap,'#d9e7e6',9);line(43,gap,56,gap,'#d9e7e6',9);line(56,-gap,70,-gap+9,'#e49b72',7);line(56,gap,70,gap-9,'#e49b72',7);ctx.restore();let z=tip(aa);dot(z.x,z.y,5,canReach()?'#66f1a8':'#f6c67a','#183443',2)}
function particlesAt(p){let colors=['#ffcf86','#7df0bb','#ff8e82','#88dfff','#fff1a8'];particles=Array.from({length:65},(_,i)=>{let a=i*2.399,s=70+Math.random()*210;return{x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,c:colors[i%5],r:2+Math.random()*5}})}
function drawParticles(t){ctx.globalAlpha=clamp(1-t/2.8,0,1);particles.forEach(p=>dot(p.x+p.vx*t,p.y+p.vy*t+115*t*t,p.r,p.c));ctx.globalAlpha=1}
function rover(x,y){ctx.save();ctx.translate(x,y);box(-48,-20,96,24,'#7e8e82',6);box(-19,-41,40,24,'#b5c7b2',4);line(5,-35,25,-59,'#acbdb9',4);dot(25,-59,7,'#f1f1df');for(let x of [-32,0,32]){dot(x,15,12,'#2e3b47');dot(x,15,5,'#9aadb2')}ctx.restore()}
function batteryDrop(x,y){line(x,0,x,y-22,'#bbcbd5',3);box(x-27,y-22,54,43,'#edc16b',6);text('Li',x-10,y+5,13,'#304453')}
function satelliteWobble(t){ctx.save();ctx.translate(838,112);ctx.rotate(Math.sin(t*6)*.12);box(-49,-32,98,64,'#648698',9);box(-130,-23,72,48,'#315471',3);box(59,-23,72,48,'#315471',3);line(-10,30,28,55,'#d8bf7d',6);dot(28,55,7,'#8bf0b4');ctx.restore()}
function successEffect(t){drawParticles(t);if(cfg.mission==='rock'){rover(1130-280*t,409);rover(1440-280*t,408)}else if(cfg.mission==='battery'){for(let i=0;i<3;i++){let k=clamp((t-.25-i*.48)*120,0,165);batteryDrop(110+i*72,27+k)}}else{let x=1030-280*t,y=15+155*t;line(x+160,y-100,x,y,'#ffdd9c',13);dot(x,y,18,'#fff3b8');satelliteWobble(t)}}
function failedArm(t){let q=broken;box(54,423,128,57,'#293f50',7);q.forEach((p,i)=>{if(i===3)return;let b=q[i+1],x=clamp(t,0,2),dx=i*45*x,dy=i*38*x+30*x*x;ctx.save();ctx.translate(dx,dy);ctx.translate(p.x,p.y);ctx.rotate((i-1)*.48*x);ctx.translate(-p.x,-p.y);line(p.x,p.y,b.x,b.y,'#405e6e',27);line(p.x,p.y,b.x,b.y,'#abc4c9',16);dot(p.x,p.y,17,'#d76860','#dce9ec',3);ctx.restore()});for(let i=0;i<14;i++){let p=q[1];dot(p.x+i*9-30, p.y-30+Math.sin(i*3+t*10)*17,2+(i%3),'#ffbc62')}}
function draw(){ctx.clearRect(0,0,W,H);background();scenes();if(outcome==='fail')failedArm((performance.now()-endStart)/1000);else armGraphic();if(outcome==='success')successEffect((performance.now()-endStart)/1000);if(!done){text('관절 선택 → 원형으로 드래그',20,68,13,cfg.mission==='rock'?'#5c3b30':'#b8dbe7');if(canReach())text('● 접촉 확인! 집게 버튼을 누르세요',20,92,13,'#8ce9b6')}}
function finish(win){if(done)return;let saved=tip();broken=joints().map(p=>({...p}));done=true;held=false;outcome=win?'success':'fail';endStart=performance.now();baseAngles=[...angles];if(win)particlesAt(saved);document.getElementById('outcome').textContent=win?'SUCCESS':'FAILED';document.getElementById('outcome').style.color=win?'#a1efbb':'#fc8179';document.getElementById('detail').textContent=win?'미션 완료!':'제한시간 종료!'}
function advance(){held=false;offset={x:0,y:0};wireIndex=-1;phase++;if(phase>=6)finish(true);else message('다음 작업: '+tasks[phase])}
function action(){if(done)return;let p=tip();if(cfg.mission==='battery'&&phase===0){if(!canReach())return message('잠금장치에 집게를 정확히 맞춰 주세요.');phase=1;return message('잠금 해제! 배터리를 오른쪽으로 당기세요.')}
if(cfg.mission==='satellite'&&(phase===1||phase===2)){if(!canReach())return message('버튼 중심에 집게 끝을 맞추세요.');return advance()}
if(!held){if(!canReach())return message('집게 끝을 목표에 더 가까이 맞춰 주세요.');if(cfg.mission==='satellite'&&phase===4){wireIndex=looseWire();if(wireIndex<0)return;let w=wires[wireIndex];offset={x:w.pos.x-p.x,y:w.pos.y-p.y}}else{let t=target();offset={x:t.x-p.x,y:t.y-p.y}}held=true;if(cfg.mission==='rock')rockLifted=true;return message('집었습니다! 물체를 이동한 뒤 다시 눌러 놓으세요.')}
held=false;
if(cfg.mission==='rock'){if(rock.x>458&&rock.x<560&&rock.y>243&&rock.y<307)return finish(true);rockVelocity={x:0,y:0};rockGrounded=false;return message('암석을 놓쳤습니다! 중력으로 떨어지고 바닥에서 굴러갑니다.')}
if(cfg.mission==='battery')return message('배터리를 놓았습니다.');
if(phase===0){if(cover.x<555)advance();else message('덮개를 왼쪽으로 더 옮기세요.');return}
if(phase===3){if(switchX>=715)advance();else message('슬라이더를 오른쪽 끝까지 당기세요.');return}
if(phase===4){let w=wires[wireIndex];if(w){if(dist(w.pos,w.socket)<=19){w.pos={...w.socket};w.connected=true;if(wires.every(v=>v.connected))advance();else message('연결 성공! 다른 색도 연결하세요.')}else{w.pos={...w.home};message('같은 색 소켓에 정확히 놓아 주세요.')}}wireIndex=-1;return}
if(phase===5){if(dist(antenna,signal())<=22)advance();else message('움직이는 전파 신호와 안테나를 맞춰 주세요.')}
}
function mouse(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{if(done)return;let p=mouse(e),ps=joints();drag=-1;let best=43;for(let i=0;i<3;i++){let d=dist(p,ps[i]);if(d<best){best=d;drag=i}}if(drag>=0){lastMouse=p;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(done||drag<0||!lastMouse)return;let p=mouse(e),pv=joints()[drag],a=Math.atan2(lastMouse.y-pv.y,lastMouse.x-pv.x),b=Math.atan2(p.y-pv.y,p.x-pv.x),delta=Math.atan2(Math.sin(b-a),Math.cos(b-a));angles[drag]=clamp(angles[drag]+delta*sens[drag],-2.85,2.85);lastMouse=p;draw()});
for(let ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>{drag=-1;lastMouse=null});
function tick(now){let dt=clamp((now-last)/1000,0,.05);last=now;sceneTime=(now-start)/1000;if(!done){let remaining=Math.max(0,Math.ceil(duration-sceneTime));clock.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;clock.classList.toggle('red',remaining<=60);if(remaining===0)finish(false);
if(held&&!done){let p=tip();if(cfg.mission==='rock'){rock={x:p.x+offset.x,y:p.y+offset.y};rockVelocity={x:0,y:0}}
else if(cfg.mission==='battery'){let desired=clamp(p.x+offset.x,608,718);battery.x+=clamp(desired-battery.x,-95*dt,95*dt);progress=clamp((battery.x-608)/110,0,1);if(progress>=.995)finish(true)}
else if(phase===0)cover={x:p.x+offset.x,y:p.y+offset.y};else if(phase===3)switchX=clamp(p.x+offset.x,595,730);else if(phase===4&&wireIndex>=0)wires[wireIndex].pos={x:p.x+offset.x,y:p.y+offset.y};else if(phase===5)antenna={x:p.x+offset.x,y:p.y+offset.y}}
// 암석을 놓으면 자유낙하한 뒤 감쇠하며 굴러감
if(cfg.mission==='rock'&&!held&&!done&&rockLifted){const ground=438-27;if(rock.y<ground||rockVelocity.y<0){rockVelocity.y+=900*dt;rock.y+=rockVelocity.y*dt;rock.x+=rockVelocity.x*dt;if(rock.y>=ground){rock.y=ground;rockVelocity.y=0;rockGrounded=true;rockVelocity.x=rockVelocity.x||75}}else{rockGrounded=true;rockVelocity.x*=Math.exp(-1.5*dt);rock.x+=rockVelocity.x*dt;if(Math.abs(rockVelocity.x)<1)rockVelocity.x=0}rock.x=clamp(rock.x,28,972)}}
else{let e=(now-endStart)/1000;if(outcome==='success'){angles=[baseAngles[0]+Math.sin(e*5.2)*.3,baseAngles[1]+Math.sin(e*7.4+.8)*.24,baseAngles[2]+Math.cos(e*8.6+.3)*.38]}if(e>4.4)document.getElementById('overlay').classList.add('show')}
draw();requestAnimationFrame(tick)}
