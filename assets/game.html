
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101924;
  color:#edf4f5;
  font:14px system-ui,"Malgun Gothic",sans-serif;
}
#app{
  position:relative;
  border:1px solid #385164;
  border-radius:15px;
  overflow:hidden;
}
header,footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 18px;
  background:#172b3d;
}
header{border-bottom:1px solid #4b6574}
footer{justify-content:flex-start;flex-wrap:wrap}
small{
  display:block;
  font:700 11px monospace;
  color:#99c5d5;
  letter-spacing:2px;
}
h2{margin:4px 0 0;font-size:20px}
#clock{
  font:bold 30px monospace;
  color:#ffd087;
}
#clock.red{
  color:#ff6464;
  animation:pulse .8s infinite alternate;
}
@keyframes pulse{to{opacity:.45}}
canvas{
  display:block;
  width:100%;
  height:480px;
  background:#152b3e;
  touch-action:none;
  cursor:crosshair;
}
button{
  color:white;
  background:#344d60;
  border:1px solid #708c9c;
  border-radius:9px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}
button.primary{
  background:#d88a60;
  color:#182431;
  border-color:#ffc099;
}
#hint{
  flex:1;
  min-width:250px;
  color:#d3dfe2;
  font-size:13px;
}
#overlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:30;
  align-items:center;
  justify-content:center;
  background:#07121ce8;
}
#overlay.show{display:flex}
.dialog{
  text-align:center;
  background:#22394b;
  border:1px solid #9bb9c5;
  border-radius:18px;
  padding:32px;
  min-width:290px;
}
.dialog h1{font-size:45px;margin:9px 0}
</style>
</head>
<body>

<div id="app">
<header>
  <div>
    <small>MECHA LAB / MISSION CONTROL</small>
    <h2 id="title">MISSION</h2>
  </div>
  <div style="text-align:right">
    <small>TIME REMAINING</small>
    <div id="clock">03:00</div>
  </div>
</header>

<canvas id="game"></canvas>

<footer>
  <button class="primary" id="action">
    집게 닫기 / 열기 (Space)
  </button>
  <button id="restart">다시 시작</button>
  <div id="hint">관절을 움직여 목표에 접근하세요.</div>
</footer>

<div id="overlay">
  <div class="dialog">
    <small>MISSION REPORT</small>
    <h1 id="outcome"></h1>
    <p id="detail"></p>
    <button class="primary" id="retry">다시 도전</button>
    <p style="font-size:12px;color:#b6cbd4">
      미션 선택 화면으로 돌아가려면
      게임 아래의 Streamlit 버튼을 이용하세요.
    </p>
  </div>
</div>
</div>

<script>
const cfg=__GAME_CONFIG__;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const clock=document.getElementById("clock");
const hint=document.getElementById("hint");

document.getElementById("title").textContent=cfg.title;

const W=1000,H=480;
const base={x:115,y:421};
const lengths=[222,241,194];
const sensitivity=[.53,.78,1.08];

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

let angles,points,drag,lastPointer;
let held,done,phase,grabOffset;
let rock,battery,cover,switchX;
let progress,started,last;
let wireIndex,wires,antenna;
let timeLimit;

const tasks=[
  "보호 덮개 제거",
  "제어 버튼 누르기",
  "슬라이드 스위치 작동",
  "전선 색상 맞춰 연결",
  "안테나 정렬 및 고정"
];

function fit(){
  const r=devicePixelRatio||1;
  canvas.width=Math.round(canvas.clientWidth*r);
  canvas.height=Math.round(480*r);
  ctx.setTransform(
    canvas.width/W,0,0,canvas.height/H,0,0
  );
}

function box(x,y,w,h,color,r=0){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function line(x,y,X,Y,color,width){
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(X,Y);
  ctx.stroke();
}

function circle(x,y,r,color,border="",width=1){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
  if(border){
    ctx.strokeStyle=border;
    ctx.lineWidth=width;
    ctx.stroke();
  }
}

function label(s,x,y,size=14,color="#e4eef1"){
  ctx.font=`bold ${size}px system-ui`;
  ctx.fillStyle=color;
  ctx.fillText(s,x,y);
}

function tell(s){
  hint.textContent=s;
}

// 로봇팔 순기구학
function arm(){
  points=[{...base}];
  let a=0;
  for(let i=0;i<3;i++){
    a+=angles[i];
    const p=points[i];
    points.push({
      x:p.x+Math.cos(a)*lengths[i],
      y:p.y+Math.sin(a)*lengths[i]
    });
  }
  return points[3];
}

// 실제 그리퍼 끝의 접촉점
function gripPoint(){
  const wrist=arm();
  const a=angles.reduce((s,v)=>s+v,0);
  return {
    x:wrist.x+61*Math.cos(a),
    y:wrist.y+61*Math.sin(a)
  };
}

// 현재 조작해야 하는 대상 좌표
function target(){
  if(cfg.mission==="rock")return rock;

  if(cfg.mission==="battery"){
    return phase===0
      ?{x:582,y:296}
      :battery;
  }

  if(phase===0)return cover;
  if(phase===1)return{x:698,y:294};
  if(phase===2)return{x:switchX,y:239};
  if(phase===3)return wires[wireIndex].pos;
  return antenna;
}

// 엄격한 접촉 판정
function limit(){
  if(cfg.mission==="rock")return 30;

  if(cfg.mission==="battery"){
    return phase===0?25:29;
  }

  if(phase===1)return 23;
  if(phase===3)return 27;
  if(phase===4)return 26;
  return 29;
}

function canInteract(){
  return !done&&!held&&
    distance(gripPoint(),target())<=limit();
}

function background(){
  if(cfg.mission==="rock"){
    box(0,0,W,H,"#e7bb93");
    box(0,335,W,145,"#cc946e");

    ctx.fillStyle="#b77c5e";
    ctx.beginPath();
    ctx.moveTo(0,360);
    ctx.bezierCurveTo(220,290,400,365,600,321);
    ctx.bezierCurveTo(780,300,900,339,1000,311);
    ctx.lineTo(1000,480);
    ctx.lineTo(0,480);
    ctx.fill();

    box(0,428,W,52,"#a87358");

    for(let i=0;i<17;i++){
      circle(
        33+i*57,
        442+(i%3)*9,
        3+(i%4),
        "#865744"
      );
    }

    label("MARS / SAMPLE SITE",22,32,14,"#624034");

  }else{
    box(0,0,W,H,"#142d41");

    for(let x=0;x<W;x+=146){
      line(x,0,x,H,"#28485d",2);
    }
    for(let y=0;y<H;y+=90){
      line(0,y,W,y,"#28485d",2);
    }

    box(0,444,W,36,"#254457");

    label(
      cfg.mission==="battery"
        ?"ORBITAL SERVICE BAY"
        :"SATELLITE REPAIR UNIT",
      22,32,14,"#a9d4df"
    );
  }
}

function gauge(value,name){
  box(758,57,220,64,"#20394b",10);
  label(name,770,78,12,"#c3dce3");
  box(770,91,194,13,"#435766",6);
  box(
    770,91,
    194*clamp(value,0,1),
    13,"#87d7a5",6
  );
}

function drawSatellite(){
  const near=canInteract();

  box(620,155,334,270,"#526f83",15);
  box(635,170,304,239,"#243e52",10);

  label(
    "STEP "+(phase+1)+"/5",
    645,193,15,"#a8d9e4"
  );
  label(tasks[phase],645,218,14,"#e4f2f4");

  if(phase===0){
    box(
      cover.x-36,cover.y-29,
      72,58,
      near?"#91e6b5":"#d7b080",
      7
    );
    box(
      cover.x-25,cover.y-18,
      50,36,"#e9c89c",4
    );
    label("COVER",cover.x-32,cover.y-40,12);

  }else if(phase===1){
    circle(
      698,294,20,
      near?"#8bf1b0":"#dc6964",
      "#f4e7df",4
    );
    label("PUSH",675,335,13);

  }else if(phase===2){
    box(657,252,198,8,"#94adb9",4);
    box(
      switchX-15,223,30,33,
      near?"#8bf1b0":"#e4c37c",5
    );
    label("SLIDE RIGHT",670,283,13);

  }else if(phase===3){
    const sockets=[
      {x:828,y:280,color:"#eb6564"},
      {x:828,y:344,color:"#61b8f0"}
    ];

    wires.forEach((w,i)=>{
      const s=sockets[i];

      line(
        624,w.pos.y,
        w.pos.x,w.pos.y,
        w.color,5
      );

      circle(
        w.pos.x,w.pos.y,13,
        w.connected?"#83e5af":w.color,
        "#e4eff1",2
      );

      circle(
        s.x,s.y,15,
        "#263d50",
        s.color,5
      );

      label(
        i===0?"RED":"BLUE",
        s.x-19,s.y-25,12,
        s.color
      );

      if(w.connected){
        line(
          624,w.pos.y,
          s.x,s.y,
          w.color,5
        );
      }
    });

    label(
      "같은 색 소켓에 전선을 연결하세요",
      642,390,13
    );

  }else{
    line(
      690,338,
      antenna.x,antenna.y,
      "#e7b46e",13
    );

    circle(
      antenna.x,antenna.y,17,
      near?"#8bf1b0":"#dfb875",
      "#f3e4c7",3
    );

    circle(
      790,160,13,
      "#24465b","#89e8b0",4
    );

    line(
      790,160,790,128,
      "#89e8b0",3
    );

    label("DOCK",764,116,13,"#a6e8c2");
    label(
      "안테나 끝을 초록색 결합부에 맞추세요",
      635,388,13
    );
  }

  gauge(
    phase/5+
    (phase===3?wireIndex/10:0),
    "위성 정비 진행률"
  );
}

function objects(){
  const near=canInteract();

  if(cfg.mission==="rock"){
    box(555,290,147,92,"#91b3a5",10);
    box(566,301,125,69,"#41675d",8);

    label(
      "SAMPLE BIN",
      567,280,13,"#624034"
    );

    circle(
      rock.x,rock.y,26,
      "#9b634a",
      near?"#83edb0":"#edc39c",
      near?5:3
    );

    circle(
      rock.x-8,rock.y-7,
      7,"#ba8464"
    );

  }else if(cfg.mission==="battery"){
    box(536,247,251,149,"#667f8c",14);
    box(552,268,218,109,"#253c4e",10);
    box(570,293,184,67,"#3d5a68",7);
    box(570,365,185,5,"#adc5c9",3);

    box(
      battery.x-32,battery.y-26,
      66,52,"#f3c36a",7
    );

    box(
      battery.x-26,battery.y-20,
      54,12,"#f9e3ad",3
    );

    label(
      "Li-ion",
      battery.x-25,
      battery.y+13,14,"#324452"
    );

    box(
      567,279,30,35,
      phase===0
        ?(near?"#82e3af":"#e56b62")
        :"#7ac6a5",
      5
    );

    label(
      phase===0?"LOCK":"OPEN",
      550,239,13
    );

    gauge(
      phase===0?0:progress,
      "배터리 분리 진행률"
    );

    label(
      phase===0
        ?"① 빨간 잠금장치를 해제하세요."
        :"② 배터리를 잡고 오른쪽으로 당기세요.",
      500,427,13
    );

  }else{
    drawSatellite();
  }
}

function drawArm(){
  const wrist=arm();

  box(54,422,128,54,"#293f50",8);
  box(75,438,88,10,"#7296a1",4);

  for(let i=0;i<3;i++){
    const a=points[i],b=points[i+1];

    line(
      a.x+5,a.y+5,
      b.x+5,b.y+5,
      "#263846",35
    );
    line(
      a.x,a.y,b.x,b.y,
      "#405e6e",30
    );
    line(
      a.x,a.y,b.x,b.y,
      "#abc4c9",19
    );
    line(
      a.x+4,a.y-4,
      b.x+4,b.y-4,
      "#ece5d8",4
    );

    circle(
      a.x+(b.x-a.x)*.32,
      a.y+(b.y-a.y)*.32,
      6,"#e9a875","#405564",2
    );
  }

  for(let i=0;i<3;i++){
    const p=points[i];

    circle(
      p.x,p.y,20,
      "#324b5b","#dce9ec",4
    );

    circle(
      p.x,p.y,13,
      drag===i?"#ffcb69":"#da6d62",
      "#2c4150",3
    );

    circle(p.x,p.y,3,"#fff7df");

    label(
      "J"+(i+1),
      p.x-11,p.y-26,12
    );
  }

  const a=angles.reduce((s,v)=>s+v,0);

  ctx.save();
  ctx.translate(wrist.x,wrist.y);
  ctx.rotate(a);

  box(-4,-15,37,30,"#425e6d",6);
  box(21,-10,23,20,"#c1d5d5",4);

  const g=held?7:20;

  line(43,-g,56,-g,"#d9e7e6",9);
  line(43,g,56,g,"#d9e7e6",9);

  line(56,-g,70,-g+9,"#e49b72",7);
  line(56,g,70,g-9,"#e49b72",7);

  ctx.restore();

  const p=gripPoint();

  circle(
    p.x,p.y,5,
    canInteract()?"#66f1a8":"#f6c67a",
    "#183443",2
  );
}

function draw(){
  ctx.clearRect(0,0,W,H);

  background();
  objects();
  drawArm();

  label(
    "빨간 관절을 선택하고 원형으로 드래그",
    20,68,13,
    cfg.mission==="rock"?"#624338":"#b9dce3"
  );

  if(canInteract()){
    label(
      "● 접촉 확인! 집게 버튼을 누르세요",
      20,92,14,
      cfg.mission==="rock"?"#357654":"#8ff2b3"
    );
  }
}

function finish(ok){
  if(done)return;
  done=true;

  const el=document.getElementById("outcome");

  el.textContent=ok?"SUCCESS":"FAILED";
  el.style.color=ok?"#a1efbb":"#fc8179";

  document.getElementById("detail").textContent=
    ok
      ?"모든 작업을 완료했습니다."
      :"제한시간이 종료되었습니다.";

  document.getElementById("overlay")
    .classList.add("show");
}

function advance(){
  held=false;
  grabOffset={x:0,y:0};
  phase++;

  if(phase>=5){
    finish(true);
  }else{
    tell(
      "다음 작업: "+tasks[phase]
    );
  }
}

function action(){
  if(done)return;

  const p=gripPoint();
  const t=target();

  if(!held&&distance(p,t)>limit()){
    tell(
      "집게 끝을 목표에 정확히 맞춰 주세요."
    );
    return;
  }

  if(cfg.mission==="battery"&&phase===0){
    phase=1;
    tell(
      "잠금 해제! 배터리를 잡고 오른쪽으로 당기세요."
    );
    return;
  }

  if(cfg.mission==="satellite"&&phase===1){
    advance();
    return;
  }

  if(!held){
    held=true;
    grabOffset={
      x:t.x-p.x,
      y:t.y-p.y
    };

    tell("물체를 잡았습니다. 이동한 뒤 놓으세요.");
    return;
  }

  held=false;

  if(cfg.mission==="rock"){
    if(
      rock.x>582&&rock.x<681&&
      rock.y>305&&rock.y<363
    ){
      finish(true);
    }else{
      tell("암석을 SAMPLE BIN 안으로 이동하세요.");
    }
    return;
  }

  if(cfg.mission==="satellite"){
    if(phase===0){
      if(cover.x<625){
        advance();
      }else{
        tell("덮개를 왼쪽으로 더 옮기세요.");
      }
    }

    else if(phase===2){
      if(switchX>=825){
        advance();
      }else{
        tell("스위치를 오른쪽으로 더 당기세요.");
      }
    }

    else if(phase===3){
      const socket=wireIndex===0
        ?{x:828,y:280}
        :{x:828,y:344};

      const wire=wires[wireIndex];

      if(distance(wire.pos,socket)<=24){
        wire.pos={...socket};
        wire.connected=true;
        wireIndex++;

        if(wireIndex>=2){
          advance();
        }else{
          tell(
            "빨간 전선 연결 완료! 파란 전선을 연결하세요."
          );
        }
      }else{
        wire.pos={...wire.home};
        tell(
          "소켓에 정확하게 맞지 않았습니다. 다시 시도하세요."
        );
      }
    }

    else if(phase===4){
      if(distance(antenna,{x:790,y:160})<=24){
        advance();
      }else{
        tell(
          "안테나 끝을 초록색 결합부에 더 정확히 맞추세요."
        );
      }
    }
  }
}

function mouse(e){
  const r=canvas.getBoundingClientRect();

  return{
    x:(e.clientX-r.left)*W/r.width,
    y:(e.clientY-r.top)*H/r.height
  };
}

canvas.addEventListener("pointerdown",e=>{
  if(done)return;

  const p=mouse(e);
  arm();

  let best=43;
  drag=-1;

  for(let i=0;i<3;i++){
    const d=distance(p,points[i]);

    if(d<best){
      best=d;
      drag=i;
    }
  }

  if(drag>=0){
    lastPointer=p;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove",e=>{
  if(done||drag<0)return;

  const p=mouse(e);
  const pivot=points[drag];

  const a=Math.atan2(
    lastPointer.y-pivot.y,
    lastPointer.x-pivot.x
  );

  const b=Math.atan2(
    p.y-pivot.y,
    p.x-pivot.x
  );

  const delta=Math.atan2(
    Math.sin(b-a),
    Math.cos(b-a)
  );

  angles[drag]=clamp(
    angles[drag]+delta*sensitivity[drag],
    -2.85,2.85
  );

  lastPointer=p;
  draw();
});

for(const ev of [
  "pointerup",
  "pointercancel",
  "lostpointercapture"
]){
  canvas.addEventListener(ev,()=>{
    drag=-1;
    lastPointer=null;
  });
}

function tick(now){
  const dt=clamp((now-last)/1000,0,.05);
  last=now;

  if(!done){
    const remain=Math.max(
      0,
      Math.ceil(timeLimit-(now-started)/1000)
    );

    clock.textContent=
      String(Math.floor(remain/60)).padStart(2,"0")
      +":"
      +String(remain%60).padStart(2,"0");

    clock.classList.toggle("red",remain<=60);

    if(remain===0){
      finish(false);
    }

    if(held&&!done){
      const p=gripPoint();

      if(cfg.mission==="rock"){
        rock={
          x:p.x+grabOffset.x,
          y:p.y+grabOffset.y
        };
      }

      else if(cfg.mission==="battery"){
        const desired=clamp(
          p.x+grabOffset.x,
          637,737
        );

        battery.x+=clamp(
          desired-battery.x,
          -105*dt,105*dt
        );

        progress=clamp(
          (battery.x-637)/100,
          0,1
        );

        if(progress>=.995){
          finish(true);
        }
      }

      else if(cfg.mission==="satellite"){
        if(phase===0){
          cover={
            x:p.x+grabOffset.x,
            y:p.y+grabOffset.y
          };
        }

        else if(phase===2){
          switchX=clamp(
            p.x+grabOffset.x,
            728,840
          );
        }

        else if(phase===3){
          const wire=wires[wireIndex];

          wire.pos={
            x:p.x+grabOffset.x,
            y:p.y+grabOffset.y
          };
        }

        else if(phase===4){
          antenna={
            x:p.x+grabOffset.x,
            y:p.y+grabOffset.y
          };
        }
      }
    }
  }

  draw();
  requestAnimationFrame(tick);
}

function restart(){
  angles=[-1.08,.48,.53];

  drag=-1;
  lastPointer=null;
  held=false;
  done=false;
  phase=0;

  rock={x:743,y:390};
  battery={x:637,y:325};
  cover={x:721,y:314};
  switchX=728;

  wireIndex=0;

  wires=[
    {
      color:"#eb6564",
      pos:{x:678,y:280},
      home:{x:678,y:280},
      connected:false
    },
    {
      color:"#61b8f0",
      pos:{x:678,y:344},
      home:{x:678,y:344},
      connected:false
    }
  ];

  antenna={x:750,y:278};

  progress=0;
  grabOffset={x:0,y:0};

  timeLimit=cfg.duration;

  started=performance.now();
  last=started;

  document.getElementById("overlay")
    .classList.remove("show");

  tell(
    "집게 끝을 목표에 정확히 맞춘 후 조작하세요."
  );

  draw();
}

document.getElementById("action").onclick=action;
document.getElementById("restart").onclick=restart;
document.getElementById("retry").onclick=restart;

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault();
    action();
  }
});

window.addEventListener("resize",()=>{
  fit();
  draw();
});

fit();
restart();
requestAnimationFrame(tick);
</script>
</body>
</html>
